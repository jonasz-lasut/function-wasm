[package]
name = "function-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Crossplane composition function that runs WebAssembly modules (Rust runtime)"
publish = false

[[bin]]
name = "function"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
flate2 = "1"
cedar-policy = "4"
clap = { version = "4", features = ["derive", "env"] }
function-sdk-rust = "0.2.0"
function-wasm-engine = { path = "../engine" }
hex = "0.4"
jsonschema = "0.33"
tempfile = "3"
pbjson-types = "0.9"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
wat = "1"
