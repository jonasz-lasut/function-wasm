[package]
name = "function-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Crossplane composition function that runs WebAssembly modules (Rust runtime)"
publish = false

[[bin]]
name = "function"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
function-sdk-rust = "0.1.0"
function-wasm-engine = { path = "../engine" }
hex = "0.4"
pbjson-types = "0.9"
prost = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
