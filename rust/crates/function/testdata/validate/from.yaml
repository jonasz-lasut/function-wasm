apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: from
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XR
  mode: Pipeline
  pipeline:
  - step: chosen
    functionRef:
      name: function-wasm
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: OCI
        from: status.module
      compositionPolicy: |
        permit (principal, action == Action::"pullModule", resource in Repository::"ghcr.io/example");
  - step: other-registry
    functionRef:
      name: function-wasm
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: OCI
        from: status.other
      compositionPolicy: |
        permit (principal, action == Action::"pullModule", resource in Repository::"ghcr.io/example");
