apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: egress
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XR
  mode: Pipeline
  pipeline:
  - step: greeter
    functionRef:
      name: function-wasm
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: OCI
        oci:
          ref: ghcr.io/example/greeter:v1@sha256:3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
      limits:
        timeout: 5s
        memory: 128Mi
      sandbox:
        egress:
          http:
          - host: api.example.com
            methods: [GET]
            pathPrefix: /v1/
        env:
          GREETING_STYLE: formal
        filesystem:
          privateTmp: true
  - step: labeler
    functionRef:
      name: function-wasm
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: OCI
        oci:
          ref: ghcr.io/example/labeler@sha256:3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a3f2a
      sandbox:
        egress:
          http:
          - host: evil.example.com
            methods: [GET]
