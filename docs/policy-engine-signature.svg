<svg viewBox="0 0 470 344" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="470" height="344" fill="#f8f7f4" rx="4"/>

  <text x="24" y="32" font-size="13.5" font-weight="700" fill="#2c2a25">Per-repository signature requirement</text>
  <text x="24" y="49" font-size="10" fill="#7a7668">Cedar decides whether a repo must be signed; the crypto stays Go</text>
  <rect x="404" y="20" width="42" height="18" rx="9" fill="#3d6b5e"/>
  <text x="425" y="32.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">BUILD</text>

  <!-- cedar request panel -->
  <rect x="24" y="64" width="422" height="108" rx="5" fill="#e8f0ec" stroke="#3d6b5e" stroke-width="1.2"/>
  <text x="38" y="82" font-size="9.5" font-weight="700" fill="#3d6b5e" letter-spacing="0.06em">CEDAR REQUEST</text>

  <text x="38" y="103" font-size="10" font-weight="600" fill="#6f6656">principal</text>
  <text x="132" y="103" font-size="10" fill="#2c2a25">Request</text>
  <text x="38" y="122" font-size="10" font-weight="600" fill="#6f6656">action</text>
  <text x="132" y="122" font-size="10" fill="#2c2a25">requireSignature</text>
  <text x="38" y="141" font-size="10" font-weight="600" fill="#6f6656">resource</text>
  <text x="132" y="141" font-size="10" fill="#2c2a25">Repository&#9656;  <tspan fill="#a09b8e">(reuses the fence hierarchy)</tspan></text>
  <text x="38" y="160" font-size="9" fill="#a09b8e">permit when { resource in Repository::"ghcr.io/prod" }  &#8594; this repo must be signed</text>

  <!-- decision flow -->
  <rect x="24" y="186" width="130" height="44" rx="4" fill="#e8f0ec" stroke="#3d6b5e" stroke-width="1"/>
  <text x="89" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#2c2a25">Cedar: required?</text>
  <text x="89" y="220" text-anchor="middle" font-size="9" fill="#7a7668">a boolean, pre-crypto</text>

  <rect x="170" y="186" width="130" height="44" rx="4" fill="#ecebe4" stroke="#c5c1b7" stroke-width="1"/>
  <text x="235" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#2c2a25">Go: cosign Verify</text>
  <text x="235" y="220" text-anchor="middle" font-size="9" fill="#7a7668">crypto - unchanged</text>

  <rect x="316" y="186" width="130" height="44" rx="4" fill="#ffffff" stroke="#c5c1b7" stroke-width="1"/>
  <text x="381" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#2c2a25">refuse if unmet</text>
  <text x="381" y="220" text-anchor="middle" font-size="9" fill="#7a7668">before the caches</text>

  <g stroke="#9a917d" stroke-width="1.4" fill="none">
    <path d="M154 208 l14 0" marker-end="url(#ah2)"/>
    <path d="M300 208 l14 0" marker-end="url(#ah2)"/>
  </g>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#9a917d"/>
    </marker>
  </defs>

  <text x="24" y="262" font-size="10.5" font-weight="700" fill="#3d6b5e">Why</text>
  <text x="24" y="279" font-size="9.5" fill="#7a7668">Today --cosign-key is all-or-nothing: signatures required for every OCI repo or none.</text>
  <text x="24" y="292" font-size="9.5" fill="#7a7668">Cedar expresses "require a signature for ghcr.io/prod, not for the dev registry" - a</text>
  <text x="24" y="305" font-size="9.5" fill="#7a7668">policy decision only. The signature check itself (ECDSA/RSA/ed25519) never moves;</text>
  <text x="24" y="318" font-size="9.5" fill="#7a7668">Cedar chooses whether to demand it, Go performs it. Small surface, real expressiveness.</text>
</svg>
