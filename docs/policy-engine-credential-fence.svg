<svg viewBox="0 0 470 344" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="470" height="344" fill="#f8f7f4" rx="4"/>

  <text x="24" y="32" font-size="13.5" font-weight="700" fill="#2c2a25">Credential fence</text>
  <text x="24" y="49" font-size="10" fill="#7a7668">a step credential is spendable only on an allowed repository</text>
  <rect x="386" y="20" width="60" height="18" rx="9" fill="#5c6b7a"/>
  <text x="416" y="32.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">DEFER</text>

  <!-- cedar request panel -->
  <rect x="24" y="64" width="422" height="108" rx="5" fill="#eef0f2" stroke="#5c6b7a" stroke-width="1.2"/>
  <text x="38" y="82" font-size="9.5" font-weight="700" fill="#5c6b7a" letter-spacing="0.06em">CEDAR REQUEST (candidate)</text>

  <text x="38" y="103" font-size="10" font-weight="600" fill="#6f6656">principal</text>
  <text x="132" y="103" font-size="10" fill="#2c2a25">Request</text>
  <text x="38" y="122" font-size="10" font-weight="600" fill="#6f6656">action</text>
  <text x="132" y="122" font-size="10" fill="#2c2a25">spendCredential</text>
  <text x="38" y="141" font-size="10" font-weight="600" fill="#6f6656">resource</text>
  <text x="132" y="141" font-size="10" fill="#2c2a25">Repository&#9656;  <tspan fill="#a09b8e">(same hierarchy as the fence)</tspan></text>
  <text x="38" y="160" font-size="9" fill="#a09b8e">permit when { context.credential in allowedCreds &amp;&amp; resource in allowedRepos }</text>

  <!-- today vs cedar -->
  <rect x="24" y="186" width="205" height="46" rx="4" fill="#ffffff" stroke="#c5c1b7" stroke-width="1"/>
  <text x="38" y="205" font-size="10" font-weight="600" fill="#2c2a25">Today: two Go checks</text>
  <text x="38" y="221" font-size="9" fill="#7a7668">repo fence, then slices.Contains</text>

  <rect x="241" y="186" width="205" height="46" rx="4" fill="#eef0f2" stroke="#5c6b7a" stroke-width="1"/>
  <text x="255" y="205" font-size="10" font-weight="600" fill="#2c2a25">Cedar: one statement</text>
  <text x="255" y="221" font-size="9" fill="#7a7668">the two conditions co-located</text>

  <text x="24" y="262" font-size="10.5" font-weight="700" fill="#5c6b7a">Why defer</text>
  <text x="24" y="279" font-size="9.5" fill="#7a7668">Set membership has no boundary subtlety Cedar improves - unlike the repo fence,</text>
  <text x="24" y="292" font-size="9.5" fill="#7a7668">this is not a correctness win, only tidier co-location of a two-condition rule. Its real</text>
  <text x="24" y="305" font-size="9.5" fill="#7a7668">value (per-tenant credential rules) only lands once the operator authors policy, so it</text>
  <text x="24" y="318" font-size="9.5" fill="#7a7668">rides with Grant policy. Keep the Go set-membership until then; move it in the same PR.</text>
</svg>
