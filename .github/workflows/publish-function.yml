name: Publish Function

on:
  workflow_dispatch:
    inputs:
      function:
        description: "The function to publish"
        type: choice
        required: true
        options:
          - function-wasm
          - function-oci
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        required: true

env:
  # These environment variables are important to the Crossplane CLI install.sh
  # script. They determine what version it installs.
  XP_CHANNEL: stable
  XP_VERSION: 'v2.5.0'

  GHCR_IMAGE: ghcr.io/jonasz-lasut/${{ inputs.function }}
  MIRROR_IMAGE: xpkg.upbound.io/jonasz-lasut/${{ inputs.function }}

  # Each function builds from its own Dockerfile and package root: the two
  # runtimes share this workflow, not their images.
  DOCKERFILE: ${{ inputs.function == 'function-oci' && 'Dockerfile.oci' || 'Dockerfile.wasm' }}
  PACKAGE_ROOT: ${{ inputs.function == 'function-oci' && 'package/oci' || 'package/wasm' }}

  UP_VERSION: v0.51.1

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Runtime
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # No GitHub Actions cache: the release image is built from
          # scratch so nothing another workflow saved can reach it.
          file: ${{ env.DOCKERFILE }}
          target: image
          # The release version is stamped into the binary: what minRuntime
          # rules in module manifests are checked against.
          build-args:
            GUESTFN_VERSION=${{ inputs.version }}
          outputs: type=docker,dest=runtime-${{ matrix.arch }}.tar

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Build Package
        # --examples-root must point at a directory of Crossplane example objects
        # only: xpkg build parses every YAML file under it. The default
        # (./examples) recurses into the guest projects and their guestfn.yaml
        # module manifests (no Kind), so the package takes one guest's
        # example/ directory, which holds nothing else. function-oci takes the
        # same directory, as its Makefile target does: the package needs a
        # root of example objects and the examples belong to the project, not
        # to one runtime.
        run: ./crossplane xpkg build --package-file=${{ matrix.arch }}.xpkg --package-root=${{ env.PACKAGE_ROOT }} --examples-root=examples/pdb-addon/example --embed-runtime-image-tarball=runtime-${{ matrix.arch }}.tar

      - name: Upload Single-Platform Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: "*.xpkg"
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft-install

      - name: Download Single-Platform Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .
          merge-multiple: true
          pattern: "!*.dockerbuild" # This gets uploaded by docker/build-push-action but must be skipped: https://github.com/actions/toolkit/pull/1874

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Multi-Platform Package to GHCR
        env:
          VERSION: ${{ inputs.version }}
        run: |
          packages=$(printf '%s,' *.xpkg)
          ./crossplane --verbose xpkg push --package-files "${packages%,}" "${GHCR_IMAGE}:${VERSION}"

      - name: Login to Upbound Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Push Multi-Platform Package to Upbound
        env:
          VERSION: ${{ inputs.version }}
        run: |
          packages=$(printf '%s,' *.xpkg)
          ./crossplane --verbose xpkg push --package-files "${packages%,}" "${MIRROR_IMAGE}:${VERSION}"
