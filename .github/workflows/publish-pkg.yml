name: Publish Function Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        required: true

env:
  # These environment variables are important to the Crossplane CLI install.sh
  # script. They determine what version it installs.
  XP_CHANNEL: stable
  XP_VERSION: 'v2.5.0'

  GHCR_IMAGE: ghcr.io/jonasz-lasut/function-wasm
  MIRROR_IMAGE: xpkg.upbound.io/jonasz-lasut/function-wasm

  UP_VERSION: v0.51.1

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Runtime
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # No GitHub Actions cache: the release image is built from
          # scratch so nothing another workflow saved can reach it.
          target: image
          # The release version is stamped into the binary: what minRuntime
          # rules in module manifests are checked against.
          build-args:
            FUNCTION_WASM_VERSION=${{ github.event.inputs.version }}
          outputs: type=docker,dest=runtime-${{ matrix.arch }}.tar

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Build Package
        # --examples-root must point at a directory of Crossplane example objects
        # only: xpkg build parses every YAML file under it. The default
        # (./examples) recurses into the guest projects and their wasmfn.yaml
        # module manifests (no Kind), and a guest's example/ dir holds its xprin
        # render test (no Kind either), so the package takes one guest's
        # example objects without the test.
        run: |
          mkdir package-examples
          cp examples/pdb-addon/example/*.yaml package-examples/
          rm package-examples/xprin.yaml
          ./crossplane xpkg build --package-file=${{ matrix.arch }}.xpkg --package-root=package/ --examples-root=package-examples --embed-runtime-image-tarball=runtime-${{ matrix.arch }}.tar

      - name: Upload Single-Platform Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: "*.xpkg"
          if-no-files-found: error
          retention-days: 1

  push:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft-install

      - name: Download Single-Platform Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .
          merge-multiple: true
          pattern: "!*.dockerbuild" # This gets uploaded by docker/build-push-action but must be skipped: https://github.com/actions/toolkit/pull/1874

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Multi-Platform Package to GHCR
        run: "./crossplane --verbose xpkg push --package-files $(echo *.xpkg|tr ' ' ,) ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }}"

      - name: Login to Upbound Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Push Multi-Platform Package to Upbound
        run: "./crossplane --verbose xpkg push --package-files $(echo *.xpkg|tr ' ' ,) ${{ env.MIRROR_IMAGE }}:${{ github.event.inputs.version }}"

  # The ABI v2 WIT world, wit/wasmfn-function.wit, as a CNCF Wasm OCI
  # artifact (wkg's format) at ghcr.io/jonasz-lasut/wasmfn/function:<world
  # version>, signed and attested like the image, plus a
  # wasmfn-wit-<world version>.tar.gz on this release (#106). The world
  # version moves independently of the runtime's: a pre-release version
  # (2.0.0-draft) is never published, and a published version is never
  # pushed again - its tag stays immutable.
  publish-wit:
    runs-on: ubuntu-26.04
    needs:
      - push
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      WIT_REPOSITORY: jonasz-lasut/wasmfn/function
      # Installed from the release binary and checked against its digest
      # rather than through cargo-binstall's install script.
      WKG_VERSION: 0.16.1
      WKG_SHA256: 235ecf455e11b8b146e00f24f24c95b573cfe6a432f332358463b229311cec57
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the World Version
        id: world
        run: |
          version=$(sed -nE 's/^package wasmfn:function@([^;]+);$/\1/p' wit/wasmfn-function.wit)
          if [ -z "${version}" ]; then
            echo "::error::wit/wasmfn-function.wit declares no package version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*)
              echo "::notice::wasmfn:function@${version} is a pre-release; not publishing it"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # 200: published already, 404: not yet (also for a repository that does
      # not exist yet); anything else stops the job rather than risk pushing
      # over a published tag.
      - name: Skip a Published World
        id: registry
        if: steps.world.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORLD_VERSION: ${{ steps.world.outputs.version }}
        run: |
          token=$(curl -sSf -u "${GITHUB_REPOSITORY_OWNER}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${WIT_REPOSITORY}:pull" | jq -r .token)
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${WIT_REPOSITORY}/manifests/${WORLD_VERSION}")
          case "${status}" in
            200)
              echo "::notice::ghcr.io/${WIT_REPOSITORY}:${WORLD_VERSION} is already published; leaving it as it is"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::cannot tell whether ghcr.io/${WIT_REPOSITORY}:${WORLD_VERSION} exists (HTTP ${status})"
              exit 1
              ;;
          esac

      - name: Install wkg
        if: steps.registry.outputs.publish == 'true'
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/wkg" \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu"
          echo "${WKG_SHA256}  ${RUNNER_TEMP}/wkg" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/wkg"

      - name: Install Cosign
        if: steps.registry.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the World
        id: push
        if: steps.registry.outputs.publish == 'true'
        env:
          WORLD_VERSION: ${{ steps.world.outputs.version }}
        run: |
          "${RUNNER_TEMP}/wkg" build --wit-dir wit -o wasmfn-function.wasm
          output=$("${RUNNER_TEMP}/wkg" oci push "ghcr.io/${WIT_REPOSITORY}:${WORLD_VERSION}" wasmfn-function.wasm \
            --annotation "org.opencontainers.image.title=wasmfn:function" \
            --annotation "org.opencontainers.image.description=The function-wasm ABI v2 WIT world" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${WORLD_VERSION}" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0")
          echo "${output}"
          digest=$(printf '%s\n' "${output}" | sed -nE 's/^digest: (sha256:[0-9a-f]{64})$/\1/p')
          if [ -z "${digest}" ]; then
            echo "::error::wkg oci push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the World
        if: steps.registry.outputs.publish == 'true'
        run: cosign sign --yes "ghcr.io/${WIT_REPOSITORY}@${{ steps.push.outputs.digest }}"

      - name: Attest SLSA Provenance to the World
        if: steps.registry.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.WIT_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attach the WIT Tarball to the Release
        if: steps.registry.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORLD_VERSION: ${{ steps.world.outputs.version }}
        run: |
          tar -czf "wasmfn-wit-${WORLD_VERSION}.tar.gz" -C wit wasmfn-function.wit
          gh release upload "${RELEASE_VERSION}" "wasmfn-wit-${WORLD_VERSION}.tar.gz"

  # guestfn, built once for the example jobs below.
  build-guestfn:
    runs-on: ubuntu-26.04
    needs:
      - push
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Build guestfn
        run: cargo build --locked --release -p guestfn

      - name: Upload guestfn
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guestfn
          path: target/release/guestfn
          if-no-files-found: error
          retention-days: 1

  # The use-case examples (#112) as CNCF Wasm OCI artifacts with their module
  # manifests, at ghcr.io/jonasz-lasut/wasmfn/examples/<name>:v<version>,
  # signed and attested like the image. Each example carries its own version
  # in its wasmfn.yaml, independent of the runtime's: a version already
  # published is never pushed again, so a release publishes only the examples
  # whose version moved, and a published tag stays immutable. Only the
  # examples that work as published are here: team-tags and dashboard-bundle
  # request egress to placeholder hosts their users replace before
  # publishing their own.
  publish-examples:
    runs-on: ubuntu-26.04
    needs:
      - build-guestfn
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudflare-origin
            toolchain: rust
          - name: policy-gate
            toolchain: node
          - name: pdb-addon
            toolchain: go
    env:
      REPOSITORY: jonasz-lasut/wasmfn/examples/${{ matrix.name }}
      EXAMPLE: examples/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Example Version
        id: example
        run: |
          version=$(sed -nE 's/^version: *([^ #]+).*$/\1/p' "${EXAMPLE}/wasmfn.yaml")
          if [ -z "${version}" ]; then
            echo "::error::${EXAMPLE}/wasmfn.yaml declares no version"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # 200: published already, so the digest is read from the registry
      # rather than pushed again; 404: not yet (also for a repository that does
      # not exist yet); anything else stops the job rather than risk pushing
      # over a published tag.
      - name: Skip a Published Version
        id: registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.example.outputs.tag }}
        run: |
          token=$(curl -sSf -u "${GITHUB_REPOSITORY_OWNER}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" | jq -r .token)
          status=$(curl -s -I -o "${RUNNER_TEMP}/manifest-headers" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${REPOSITORY}/manifests/${TAG}")
          case "${status}" in
            200)
              digest=$(tr -d '\r' < "${RUNNER_TEMP}/manifest-headers" | sed -nE 's/^docker-content-digest: (sha256:[0-9a-f]{64})$/\1/Ip')
              if [ -z "${digest}" ]; then
                echo "::error::ghcr.io/${REPOSITORY}:${TAG} answered without a digest"
                exit 1
              fi
              echo "::notice::ghcr.io/${REPOSITORY}:${TAG} is already published; leaving it as it is"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::cannot tell whether ghcr.io/${REPOSITORY}:${TAG} exists (HTTP ${status})"
              exit 1
              ;;
          esac

      - name: Download guestfn
        if: steps.registry.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guestfn
          path: ${{ runner.temp }}/guestfn

      # pdb-addon's Makefile builds through guestfn; the push below uses it too.
      - name: Use the Prebuilt guestfn
        if: steps.registry.outputs.publish == 'true'
        run: |
          chmod +x "${RUNNER_TEMP}/guestfn/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/guestfn/guestfn" >> "$GITHUB_ENV"

      # cloudflare-origin's rust-toolchain.toml brings its own toolchain and
      # target; prost-build needs protoc.
      - name: Setup Rust
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup protoc
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'rust'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Go
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: ${{ env.EXAMPLE }}/go.mod

      - name: Build the Example
        if: steps.registry.outputs.publish == 'true'
        run: make -C "${EXAMPLE}" build

      - name: Install Cosign
        if: steps.registry.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # guestfn push refuses a module the runtime would refuse, publishes the
      # module manifest as the artifact's second layer, and is reproducible
      # under SOURCE_DATE_EPOCH.
      - name: Push the Example
        id: push
        if: steps.registry.outputs.publish == 'true'
        env:
          TAG: ${{ steps.example.outputs.tag }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          output=$("${GUESTFN}" push --file "${EXAMPLE}/fn.wasm" --manifest "${EXAMPLE}/wasmfn.yaml" \
            --revision "${GITHUB_SHA}" "ghcr.io/${REPOSITORY}:${TAG}")
          echo "${output}"
          digest=$(printf '%s\n' "${output}" | sed -nE 's/^Pushed .*@(sha256:[0-9a-f]{64})$/\1/p')
          if [ -z "${digest}" ]; then
            echo "::error::guestfn push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the Example
        if: steps.registry.outputs.publish == 'true'
        run: cosign sign --yes "ghcr.io/${REPOSITORY}@${{ steps.push.outputs.digest }}"

      - name: Attest SLSA Provenance to the Example
        if: steps.registry.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Published now or earlier, the reference goes into the release asset.
      - name: Record the Reference
        env:
          TAG: ${{ steps.example.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest || steps.registry.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ref"
          printf -- '- name: %s\n  ref: ghcr.io/%s:%s@%s\n' "${{ matrix.name }}" "${REPOSITORY}" "${TAG}" "${DIGEST}" \
            > "${RUNNER_TEMP}/ref/${{ matrix.name }}.yaml"

      - name: Upload the Reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-ref-${{ matrix.name }}
          path: ${{ runner.temp }}/ref/${{ matrix.name }}.yaml
          if-no-files-found: error
          retention-days: 1

  # One file on the release listing every published example's reference,
  # pinned by digest, for a Composition's module.oci.ref.
  examples-release-asset:
    runs-on: ubuntu-26.04
    needs:
      - publish-examples
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Download the References
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: example-ref-*
          path: refs
          merge-multiple: true

      - name: Attach the References to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="function-wasm-examples-${RELEASE_VERSION}.yaml"
          {
            echo "# The function-wasm use-case examples published with ${RELEASE_VERSION}:"
            echo "# each module's OCI reference, pinned by digest, for a Composition's"
            echo "# module.oci.ref. Signed keyless by ${GITHUB_REPOSITORY}'s release workflow."
            echo "examples:"
            cat refs/*.yaml
          } > "${asset}"
          cat "${asset}"
          gh release upload "${RELEASE_VERSION}" "${asset}" --repo "${GITHUB_REPOSITORY}"
