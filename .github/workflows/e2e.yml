# The end-to-end suite, hand-triggered by commenting /e2e on a pull request
# (the pattern upjet providers use for uptest): the per-guest render jobs - each
# guest built with its own toolchain, served by the runtime built from the
# PR, rendered by crossplane render - and the full guest behavioural suite,
# which the always-on CI keeps toolchain-free. The result is reported as a
# commit status on the PR's head, since an issue_comment run does not show
# up as a check by itself.
#
# An issue_comment run uses this file from the default branch but builds the
# pull request's code, so only the repository's owner, members and
# collaborators can start it, the jobs that run that code get a read-only
# token, and no checkout leaves the token behind for the code to read. Nor do
# the jobs restore or save caches (rust-cache, setup-go, setup-zig, npm): they
# run in the default branch's cache scope, where trusted workflows would
# restore whatever the pull request's code wrote.
name: E2E

on:
  issue_comment:
    types: [created]

# Read-only by default; start and report, which run none of the pull
# request's code, take the write scopes they need.
permissions:
  contents: read

jobs:
  # Gates the whole run on a /e2e comment on a pull request, acknowledges
  # the comment with a reaction, resolves the PR's head SHA and marks its
  # e2e status pending.
  start:
    runs-on: ubuntu-26.04
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/e2e')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    # Reactions and the head lookup on a pull request's comment go through
    # the pull-requests permission; issues: write stays for comments on
    # plain issues.
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Best effort: the acknowledgement is cosmetic and must never take
      # the run down.
      - name: Acknowledge the Comment
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket || true

      - name: Resolve the PR Head
        id: pr
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" -q .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mark the Status Pending
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context=e2e -f description="running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The runtime every render job serves its guest with, and guestfn for the
  # guests that build through it, compiled once per run and handed to the
  # render jobs as an artifact - the jobs keep no caches, so each one used
  # to compile the release runtime itself.
  build-tools:
    runs-on: ubuntu-26.04
    needs: start
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Build the Runtime and guestfn
        run: cargo build --locked --release -p function-wasm -p guestfn

      - name: Upload the Runtime and guestfn
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tools
          path: |
            target/release/function
            target/release/guestfn
          if-no-files-found: error
          retention-days: 1

  # The guest behavioural suite with every toolchain installed - what the
  # always-on unit-test job skips (SKIP_GUEST_BUILDS): all guests through
  # the whole host, greetings, granted and refused egress, manifestPath,
  # guest-side fatals and logs.
  #
  # Built in release: a debug wasmtime compiles the large guests (the Go
  # module, the TypeScript and Python components) many times slower, and
  # the arm64 runner is faster again. x86-64 code generation stays covered
  # by the render jobs, which serve every guest through an x86-64 runtime.
  guest-suite:
    runs-on: ubuntu-26.04-arm
    needs: start
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/hello-go/go.mod

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: '0.41.1'

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run the Guest Suite
        run: cargo test --locked --release -p function-wasm --test guests

  # The example guest is the scaffold rendered for itself. Rendering it with
  # crossplane render against the runtime built from this tree proves the
  # whole chain: guest compiles to wasm, the runtime serves it over gRPC,
  # Crossplane accepts the response.
  render-go:
    name: render (go)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # These environment variables are important to the Crossplane CLI
      # install.sh script. They determine what version it installs.
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/hello-go/go.mod

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Vet and Test the Example Guest
        working-directory: examples/hello-go
        run: |
          go vet ./...
          go test -race ./...

      - name: Render the Example
        run: make -C examples/hello-go render-check

  # The same guest without function-sdk-go, built with TinyGo: protobuf-go
  # message types plus vtprotobuf's reflection-free codecs, generated from the
  # vendored proto and committed (regenerated here to catch drift), then
  # rendered through the runtime.
  render-tinygo:
    name: render (tinygo)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/hello-tinygo/go.mod

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: '0.41.1'

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # make generate builds the protoc plugins from go.mod's tool directives.
      - name: Check Generated Code
        working-directory: examples/hello-tinygo
        run: |
          go mod tidy
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-tinygo is not up to date with its proto or go.mod; commit the result of make generate:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Test the TinyGo Guest
        working-directory: examples/hello-tinygo
        run: go test -race ./...

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the TinyGo Guest
        run: make -C examples/hello-tinygo render-check

  # The same guest in Rust (prost over the vendored proto, cdylib for
  # wasm32-wasip1), rendered through the runtime.
  render-rust:
    name: render (rust)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and Test the Rust Guest
        working-directory: examples/hello-rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip1 -- -D warnings
          cargo test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the Rust Guest
        run: make -C examples/hello-rust render-check

  render-rust-v2:
    name: render (rust-v2)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The guest's Makefile names its wasm target (and a rust-toolchain.toml
      # beside it may pin the compiler), so the lint follows the pull
      # request's code rather than this file, which comes from main.
      - name: Lint and Test the ABI v2 Rust Guest
        run: make -C examples/hello-rust-v2 lint test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the ABI v2 Rust Guest
        run: make -C examples/hello-rust-v2 render-check

  # The same guest in Zig (zig-protobuf over the vendored proto), rendered
  # through the runtime. One zig binary builds it; protoc is only needed to
  # regenerate the checked-in codec, which zig build gen-proto downloads.
  render-zig:
    name: render (zig)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Check Generated Codec
        working-directory: examples/hello-zig
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-zig/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Lint and Test the Zig Guest
        working-directory: examples/hello-zig
        run: |
          zig fmt --check build.zig src/main.zig
          zig build test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the Zig Guest
        run: make -C examples/hello-zig render-check

  # The same guest in C (nanopb over the vendored proto), compiled by zig cc
  # behind its build.zig, rendered through the runtime. The same zig binary
  # builds it; nanopb_generator (and protoc) are only needed to regenerate the
  # checked-in codec.
  render-c:
    name: render (c)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The nanopb version must match the one the checked-in codec was
      # generated with (its header names it) and the one build.zig fetches.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Setup nanopb_generator
        run: pip install nanopb==0.4.9.1

      - name: Check Generated Codec
        working-directory: examples/hello-c
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-c/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Lint and Test the C Guest
        working-directory: examples/hello-c
        run: |
          zig fmt --check build.zig
          zig build test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the C Guest
        run: make -C examples/hello-c render-check

  # The same guest in AssemblyScript (as-proto over the vendored proto, four
  # hand-written codec files where the generator gets this proto wrong),
  # rendered through the runtime. protoc and as-proto-gen are only needed to
  # regenerate the checked-in codec (make gen-proto).
  render-assemblyscript:
    name: render (assemblyscript)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache-dependency-path: examples/hello-assemblyscript/package-lock.json

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the AssemblyScript Guest
        run: make -C examples/hello-assemblyscript render-check

  render-ts:
    name: render (ts)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache-dependency-path: examples/hello-ts/package-lock.json

      - name: Test the TypeScript Guest
        run: make -C examples/hello-ts test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the TypeScript Guest
        run: make -C examples/hello-ts render-check

  render-python:
    name: render (python)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime and guestfn come from build-tools; render.sh and the
      # Makefiles take them from FUNCTION_BIN and GUESTFN instead of building.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime and guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Test the Python Guest
        run: make -C examples/hello-python test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the Python Guest
        run: make -C examples/hello-python render-check

  # One commit status carries the verdict back to the PR.
  report:
    runs-on: ubuntu-26.04
    needs: [start, guest-suite, render-go, render-tinygo, render-rust, render-rust-v2, render-zig, render-c, render-assemblyscript, render-ts, render-python]
    if: always() && needs.start.result == 'success'
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report the Result
        run: |
          state=success
          description="all jobs passed"
          for result in "${{ needs.guest-suite.result }}" "${{ needs.render-go.result }}" \
            "${{ needs.render-tinygo.result }}" "${{ needs.render-rust.result }}" \
            "${{ needs.render-rust-v2.result }}" \
            "${{ needs.render-zig.result }}" "${{ needs.render-c.result }}" \
            "${{ needs.render-assemblyscript.result }}" "${{ needs.render-ts.result }}" \
            "${{ needs.render-python.result }}"; do
            if [ "$result" != "success" ]; then
              state=failure
              description="at least one job did not pass"
            fi
          done
          gh api "repos/${{ github.repository }}/statuses/${{ needs.start.outputs.sha }}" \
            -f state="$state" -f context=e2e -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
