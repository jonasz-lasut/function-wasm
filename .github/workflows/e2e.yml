          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn" \
            "${RUNNER_TEMP}/e2e-tools/xprin"
          {
            echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function"
            echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn"
            echo "XPRIN=${RUNNER_TEMP}/e2e-tools/xprin"
          } >> "$GITHUB_ENV"

      # NativeAOT-LLVM's linux-x64 compiler: the Makefile builds with the
      # host's dotnet here, no container.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Lint and Test the C# Guest
