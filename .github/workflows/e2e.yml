# The end-to-end workflow for both functions the repository ships. It runs
# on a pull request's own events, and the labels on the pull request say
# which scenarios run:
#
#   e2e:all                         every scenario below
#   e2e:wasm:all                    every wasm scenario
#   e2e:wasm:default|strict|lifecycle
#                                   one wasm profile, on a cluster of its own
#   e2e:wasm:examples               the WebAssembly examples' build jobs
#   e2e:oci:all                     every oci scenario
#   e2e:oci:default|privileges|snapshots
#                                   one oci profile, on a cluster of its own
#   e2e:oci:examples                build (oci-go)
#
# Several labels run their union. A labelled pull request runs again on
# every push, a newer commit cancelling the run of the one before it, until
# the label is removed. The scenarios are e2e-wasm.yml's and e2e-oci.yml's
# jobs, each a check on the pull request, so nothing is posted: the jobs
# are the report. The last job, e2e-gate, is the one a ruleset requires: it
# passes when nothing was selected or everything selected passed.
#
# A pull_request run uses the pull request's own copy of this file and of
# the two it calls, so a change to them is exercised before it merges. For
# a pull request from a fork the token is read-only and no secret is
# passed; the jobs need neither. A run here restores caches and saves none
# (ci.yml says what the saves cost), so the code of a pull request never
# writes a cache another run reads: the caches are main's, saved by
# e2e-caches.yml on every push there, under keys the comment-triggered
# workflow before this one never wrote.
name: E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# One group per pull request, the newest event cancelling the run before
# it. Any label fires `labeled`, and one that is not an e2e: label selects
# nothing new: its run takes a group of its own (the run's id), so it never
# cancels a run in progress, and e2e-gate repeats the verdict the commit
# already has.
concurrency:
  group: >-
    e2e-${{ github.event.pull_request.number }}-${{
    (github.event.action != 'labeled' || startsWith(github.event.label.name, 'e2e:')) && 'run' || github.run_id }}
  cancel-in-progress: true

jobs:
  # The labels, read into what the two workflows below take. A profile is
  # whatever follows e2e:<runtime>: in a label, so a new profile needs a
  # label, its make target and its place in the workflow's `all`, and
  # nothing here; a label naming no profile fails at its make target.
  select:
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.select.outputs.relevant }}
      wasm: ${{ steps.select.outputs.wasm }}
      wasm-profiles: ${{ steps.select.outputs.wasm-profiles }}
      wasm-examples: ${{ steps.select.outputs.wasm-examples }}
      oci: ${{ steps.select.outputs.oci }}
      oci-profiles: ${{ steps.select.outputs.oci-profiles }}
      oci-examples: ${{ steps.select.outputs.oci-examples }}
    steps:
      - name: Read the Labels
        id: select
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # profiles <runtime>: all, or the JSON array of the profiles the
          # labels name.
          profiles() {
            jq -r --arg runtime "$1" '
              ("e2e:" + $runtime + ":") as $prefix
              | if any(.[]; . == "e2e:all" or . == $prefix + "all") then "all"
                else [.[] | select(startswith($prefix)) | ltrimstr($prefix) | select(. != "examples")] | unique | tojson
                end' <<< "$LABELS"
          }
          # examples <runtime>: whether the labels select its examples.
          examples() {
            jq -r --arg runtime "$1" '
              any(.[]; . == "e2e:all" or . == "e2e:" + $runtime + ":all" or . == "e2e:" + $runtime + ":examples")' <<< "$LABELS"
          }
          relevant=true
          case "${ACTION}:${LABEL}" in
            labeled:e2e:*) ;;
            labeled:*) relevant=false ;;
          esac
          wasm_profiles=$(profiles wasm) oci_profiles=$(profiles oci)
          wasm_examples=$(examples wasm) oci_examples=$(examples oci)
          # A profile's name reaches a make target.
          for names in "$wasm_profiles" "$oci_profiles"; do
            if [ "$names" != all ] && ! jq -e 'all(.[]; test("^[a-z0-9-]+$"))' <<< "$names" > /dev/null; then
              echo "::error::a label names a profile that is not lowercase letters, digits and dashes: ${names}"
              exit 1
            fi
          done
          wasm=false oci=false
          if [ "$wasm_profiles" != '[]' ] || [ "$wasm_examples" = true ]; then wasm=true; fi
          if [ "$oci_profiles" != '[]' ] || [ "$oci_examples" = true ]; then oci=true; fi
          {
            echo "relevant=${relevant}"
            echo "wasm=${wasm}"
            echo "wasm-profiles=${wasm_profiles}"
            echo "wasm-examples=${wasm_examples}"
            echo "oci=${oci}"
            echo "oci-profiles=${oci_profiles}"
            echo "oci-examples=${oci_examples}"
          } | tee -a "$GITHUB_OUTPUT"
          {
            if [ "$relevant" = false ]; then
              echo "The label \`${LABEL}\` selects no scenario: nothing runs, and \`e2e-gate\` repeats the verdict this commit has."
            fi
            echo "| Runtime | Profiles | Examples |"
            echo "|---|---|---|"
            echo "| wasm | \`${wasm_profiles}\` | ${wasm_examples} |"
            echo "| oci | \`${oci_profiles}\` | ${oci_examples} |"
          } >> "$GITHUB_STEP_SUMMARY"

  wasm:
    needs: select
    if: needs.select.outputs.relevant == 'true' && needs.select.outputs.wasm == 'true'
    uses: ./.github/workflows/e2e-wasm.yml
    with:
      profiles: ${{ needs.select.outputs.wasm-profiles }}
      examples: ${{ needs.select.outputs.wasm-examples == 'true' }}

  oci:
    needs: select
    if: needs.select.outputs.relevant == 'true' && needs.select.outputs.oci == 'true'
    uses: ./.github/workflows/e2e-oci.yml
    with:
      profiles: ${{ needs.select.outputs.oci-profiles }}
      examples: ${{ needs.select.outputs.oci-examples == 'true' }}

  # The one check a ruleset requires. It passes when nothing was selected
  # or everything selected passed, and fails when a selected scenario, or a
  # build it waited for, failed or was cancelled. Its check exists only once
  # the scenarios have ended: an e2e: label added to a commit that already
  # has a verdict leaves that verdict standing until this job replaces it.
  #
  # A label that is not an e2e: one starts a run too, with nothing to run.
  # A skipped or passing gate from that run would replace a failed one on
  # the same commit, so the gate looks up the verdict the commit already
  # has, the latest e2e-gate check that ran to an end, and repeats it. With
  # no verdict yet it passes, unless the pull request has an e2e: label:
  # then the run that owes the verdict is still going (or was cancelled),
  # and this gate fails until that one's replaces it.
  e2e-gate:
    runs-on: ubuntu-26.04
    needs:
      - select
      - wasm
      - oci
    if: always()
    permissions:
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELECT: ${{ needs.select.result }}
      RELEVANT: ${{ needs.select.outputs.relevant }}
      WASM_SELECTED: ${{ needs.select.outputs.wasm }}
      WASM: ${{ needs.wasm.result }}
      OCI_SELECTED: ${{ needs.select.outputs.oci }}
      OCI: ${{ needs.oci.result }}
    steps:
      - name: Decide
        run: |
          if [ "$SELECT" != success ]; then
            echo "::error::the labels could not be read (select: ${SELECT})"
            exit 1
          fi
          if [ "$RELEVANT" = true ]; then
            failed=0
            # judge <name> <selected> <result>: a selected scenario must
            # have passed; one not selected was skipped.
            judge() {
              if [ "$2" = true ] && [ "$3" != success ]; then
                echo "::error::$1: $3"
                failed=1
              elif [ "$2" != true ] && [ "$3" != skipped ]; then
                echo "::error::$1 was not selected and yet: $3"
                failed=1
              else
                echo "$1: $3"
              fi
            }
            judge wasm "$WASM_SELECTED" "$WASM"
            judge oci "$OCI_SELECTED" "$OCI"
            exit "$failed"
          fi
          # A check cut short by a cancellation is no verdict; this job's
          # own check is still in progress.
          verdict=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=e2e-gate&filter=all&per_page=100" \
            --jq '.check_runs[]
              | select(.app.slug == "github-actions" and .status == "completed")
              | select(.conclusion != "cancelled" and .conclusion != "skipped")
              | [.completed_at, .conclusion, .html_url] | @tsv' \
            | sort | tail -n 1)
          if [ -n "$verdict" ]; then
            conclusion=$(cut -f2 <<< "$verdict")
            echo "the verdict ${HEAD_SHA} has: ${conclusion} ($(cut -f3 <<< "$verdict"))"
            [ "$conclusion" = success ]
          elif [ "$WASM_SELECTED" = true ] || [ "$OCI_SELECTED" = true ]; then
            echo "::error::${HEAD_SHA} has no e2e-gate verdict yet and the pull request selects scenarios: the run that owes it is in progress or was cancelled, and its e2e-gate replaces this one"
            exit 1
          else
            echo "${HEAD_SHA} has no e2e-gate verdict and the pull request selects nothing"
          fi
