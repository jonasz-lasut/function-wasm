# The end-to-end workflow, hand-triggered by commenting /e2e on a pull
# request (the pattern upjet providers use for uptest): the full guest
# behavioural suite, which the always-on CI keeps toolchain-free; one build
# job per example toolchain (build, unit tests, lint, codec and bindings
# drift); and the cluster job, the Kubernetes-native end-to-end suite
# (crates/e2e, docs/project/testing.md) against the runtime built from the
# PR, installed as a Function in a kind cluster. The result is reported as a
# commit status on the PR's head, since an issue_comment run does not show
# up as a check by itself.
#
# An issue_comment run uses this file from the default branch but builds the
# pull request's code, so a change to this file is exercised only after it
# merges - unless the workflow is dispatched by hand on its branch
# (workflow_dispatch runs the file from the chosen ref, against that ref),
# which reports no commit status. Only the repository's owner, members and
# collaborators can start a comment run, the jobs that run that code get a
# read-only token, and no checkout leaves the token behind for the code to
# read. Nor do
# the jobs restore or save caches (rust-cache, setup-go, setup-zig, npm): they
# run in the default branch's cache scope, where trusted workflows would
# restore whatever the pull request's code wrote.
name: E2E

on:
  issue_comment:
    types: [created]
  workflow_dispatch: {}

# Read-only by default; start and report, which run none of the pull
# request's code, take the write scopes they need.
permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-26.04
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/e2e')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # Reactions and the head lookup on a pull request's comment go through
    # the pull-requests permission; issues: write stays for comments on
    # plain issues.
    permissions:
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Best effort: the acknowledgement is cosmetic and must never take
      # the run down.
      - name: Acknowledge the Comment
        if: github.event_name == 'issue_comment'
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket || true

      # The code under test: the pull request's merge ref for a comment run,
      # the dispatched ref otherwise.
      - name: Resolve the Code Under Test
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" -q .head.sha)
            ref="refs/pull/${{ github.event.issue.number }}/merge"
          else
            sha="${{ github.sha }}"
            ref="${{ github.ref }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Mark the Status Pending
        if: github.event_name == 'issue_comment'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context=e2e -f description="running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The runtime and guestfn, compiled once per run with a warm cargo cache
  # and handed to the other jobs as an artifact: the cluster job wraps the
  # runtime into its image (Dockerfile.dev) instead of compiling the
  # workspace cold in the Dockerfile's build stage, and the guests that
  # build through guestfn take it from GUESTFN.
  build-tools:
    runs-on: ubuntu-26.04
    needs: start
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Build the Runtime and guestfn
        run: cargo build --locked --release -p function-wasm -p guestfn

      - name: Upload the Runtime and guestfn
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tools
          path: |
            target/release/function
            target/release/guestfn
          if-no-files-found: error
          retention-days: 1

  # The guest behavioural suite with every toolchain installed - what the
  # always-on unit-test job skips (SKIP_GUEST_BUILDS): every language's
  # scaffold, built from what guestfn init writes, through the whole host -
  # greetings, granted and refused egress, manifestPath, guest-side fatals
  # and logs. A scaffold has no lockfile, so this resolves dependencies the
  # way a user's first build does.
  #
  # Built in release: a debug wasmtime compiles the large guests (the Go
  # module, the TypeScript and Python components) many times slower, and
  # the arm64 runner is faster again. x86-64 code generation stays covered
  # by the cluster job, which serves the test module through an x86-64
  # runtime.
  #
  # FUNCTION_WASM_REQUIRE_TOOLCHAINS: a guest whose toolchain is missing
  # fails here instead of skipping, so a runner that lost a toolchain cannot
  # shrink the suite and stay green.
  guest-suite:
    runs-on: ubuntu-26.04-arm
    needs: start
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # The rust-v2 guest's rust-toolchain.toml brings its own toolchain and
      # target; stable builds the runtime under test.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/pdb-addon/go.mod

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the Guest Suite
        env:
          FUNCTION_WASM_REQUIRE_TOOLCHAINS: '1'
        run: cargo test --locked --release -p function-wasm --test guests

  # Each example guest, built with its own toolchain, unit-tested and linted,
  # its generated codec and bindings checked for drift. What an example
  # composes is asserted by nothing here: the cluster job below drives the
  # suite's own module through Crossplane.
  #
  # The Go guest, an ABI v2 component: the pdb-addon use case. go build
  # emits the wasip1 core module and guestfn embeds its world and wraps it
  # (no componentize-go, no wasm-tools); wit-bindgen is only needed to
  # regenerate the checked-in Go bindings, which this job does to catch
  # drift.
  build-go:
    name: build (go)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # The wit-bindgen that wrote the checked-in bindings (their header
      # names it), as a release binary pinned by checksum.
      WIT_BINDGEN_VERSION: 0.62.0
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/pdb-addon/go.mod


      - name: Setup wit-bindgen
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wit-bindgen.tar.gz" \
            "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz"
          echo "${WIT_BINDGEN_SHA256}  ${RUNNER_TEMP}/wit-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/wit-bindgen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check Generated Bindings
        working-directory: examples/pdb-addon
        run: |
          make gen-bindings
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/pdb-addon/internal/bindings is not up to date with its wit; commit the result of make gen-bindings (at the root, which also mirrors it into the go template):"
            git status --porcelain
            git diff
            exit 1
          fi

      # vet takes the guest's own packages: internal/bindings is wit-bindgen's
      # output, whose pointer arithmetic over the wasm linear memory is what
      # vet's unsafeptr check flags.
      - name: Build, Vet and Test the Example Guest
        working-directory: examples/pdb-addon
        run: |
          make build
          go vet $(go list ./... | grep -v /internal/bindings/)
          go test -race ./...

  # The Rust guest, an ABI v2 component (wasm32-wasip3 on the toolchain its
  # rust-toolchain.toml pins): the cloudflare-origin use case.
  build-rust:
    name: build (rust)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The guest's Makefile names its wasm target (and a rust-toolchain.toml
      # beside it may pin the compiler), so the lint follows the pull
      # request's code rather than this file, which comes from main.
      - name: Build, Lint and Test the ABI v2 Rust Guest
        run: make -C examples/cloudflare-origin build lint test

  # The same guest in Zig, an ABI v2 component: zig-protobuf over the
  # vendored proto and wit-bindgen's C bindings over its world (the c
  # guest's, byte for byte, read through translate-c), built by zig into a
  # core module that guestfn wraps (no wasm-tools, no adapter download).
  # One zig binary builds it; protoc (which
  # zig build gen-proto downloads) and wit-bindgen are only needed to
  # regenerate the checked-in codec and bindings, which this job does to
  # catch drift.
  build-zig:
    name: build (zig)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # The wit-bindgen that wrote the checked-in bindings (their header
      # names it), as a release binary pinned by checksum.
      WIT_BINDGEN_VERSION: 0.62.0
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Check Generated Codec
        working-directory: examples/hello-zig
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-zig/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Setup wit-bindgen
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wit-bindgen.tar.gz" \
            "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz"
          echo "${WIT_BINDGEN_SHA256}  ${RUNNER_TEMP}/wit-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/wit-bindgen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check Generated Bindings
        working-directory: examples/hello-zig
        run: |
          zig build gen-bindings
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-zig/src/gen is not up to date with its wit; commit the result of zig build gen-bindings:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build, Lint and Test the Zig Guest
        working-directory: examples/hello-zig
        run: |
          zig fmt --check build.zig src/main.zig src/wasmfn.zig
          zig build test
          make build

  # The same guest in C, an ABI v2 component: nanopb over the vendored proto
  # and wit-bindgen's C bindings over its world, compiled by zig cc behind
  # its build.zig into a core module that guestfn wraps (no wasm-tools, no
  # adapter download). The same zig binary
  # builds it; nanopb_generator (and protoc) and wit-bindgen are only needed
  # to regenerate the checked-in codec and bindings, which this job does to
  # catch drift.
  build-c:
    name: build (c)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # The wit-bindgen that wrote the checked-in bindings (their header
      # names it), as a release binary pinned by checksum.
      WIT_BINDGEN_VERSION: 0.62.0
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The nanopb version must match the one the checked-in codec was
      # generated with (its header names it) and the one build.zig fetches.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Setup nanopb_generator
        run: pip install nanopb==0.4.9.1

      - name: Check Generated Codec
        working-directory: examples/hello-c
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-c/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Setup wit-bindgen
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wit-bindgen.tar.gz" \
            "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz"
          echo "${WIT_BINDGEN_SHA256}  ${RUNNER_TEMP}/wit-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/wit-bindgen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check Generated Bindings
        working-directory: examples/hello-c
        run: |
          zig build gen-bindings
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-c/src/gen is not up to date with its wit; commit the result of zig build gen-bindings:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build, Lint and Test the C Guest
        working-directory: examples/hello-c
        run: |
          zig fmt --check build.zig
          zig build test
          make build

  # The same guest in Odin, an ABI v2 component on the c flavour's plumbing
  # (its C bindings, nanopb codec, WIT and proto byte for byte): odin
  # compiles the guest to a freestanding wasm32 object, zig cc compiles the
  # C half and links the core module behind its build.zig, and guestfn
  # wraps it like the c guest (no wasm-tools, no adapter download). Odin is
  # its GitHub release for linux amd64, pinned by checksum like wit-bindgen
  # (the binary is statically linked, its base and core collections sit
  # beside it); the codec and bindings drift checks are the c job's, over
  # this example's copies.
  build-odin:
    name: build (odin)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # The wit-bindgen that wrote the checked-in bindings (their header
      # names it), as a release binary pinned by checksum.
      WIT_BINDGEN_VERSION: 0.62.0
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
      # The Odin release the example builds with (its README names it).
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The nanopb version must match the one the checked-in codec was
      # generated with (its header names it) and the one build.zig fetches.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Setup nanopb_generator
        run: pip install nanopb==0.4.9.1

      - name: Check Generated Codec
        working-directory: examples/hello-odin
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-odin/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Setup wit-bindgen
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wit-bindgen.tar.gz" \
            "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz"
          echo "${WIT_BINDGEN_SHA256}  ${RUNNER_TEMP}/wit-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/wit-bindgen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check Generated Bindings
        working-directory: examples/hello-odin
        run: |
          zig build gen-bindings
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-odin/src/gen is not up to date with its wit; commit the result of zig build gen-bindings:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Setup Odin
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          echo "${ODIN_SHA256}  ${RUNNER_TEMP}/odin.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/odin"
          tar -xzf "${RUNNER_TEMP}/odin.tar.gz" -C "${RUNNER_TEMP}/odin" --strip-components=1
          echo "${RUNNER_TEMP}/odin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/odin/odin" version

      - name: Build, Lint and Test the Odin Guest
        working-directory: examples/hello-odin
        run: |
          zig fmt --check build.zig
          zig build lint
          zig build test
          make build

  # The same guest in MoonBit, an ABI v2 component: protoc-gen-mbt's codec
  # over the vendored proto (the well-known types from the moonbitlang/protobuf
  # runtime) and wit-bindgen's MoonBit bindings over its world, built by moon
  # into a core module that guestfn embeds the world into (UTF-16, MoonBit's
  # string encoding) and wraps (no wasm-tools, no adapter). moon is pinned
  # to the release the example was written against, by checksum; protoc
  # (with protoc-gen-mbt through
  # moonx) and wit-bindgen are only needed to regenerate the checked-in codec
  # and bindings, which this job does to catch drift.
  build-moonbit:
    name: build (moonbit)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # The toolchain release: moonc's version string names it on
      # cli.moonbitlang.com (moon 0.1.20260920, moonc v0.10.14+7d59c7ec9),
      # the toolchain and its core as two tarballs the installer would fetch.
      MOON_VERSION: 0.10.14+7d59c7ec9
      MOON_SHA256: 9226694de9ff978db1ecf820b7710c4224e84ec7a76b19a222d96f0cd4e31b6a
      MOON_CORE_SHA256: 6f18b8fdea18f85e628a75e4a1bd3977c5a5c9c6a836fd8824192b0e6bd91b14
      # The wit-bindgen that wrote the checked-in bindings (their header
      # names it), as a release binary pinned by checksum.
      WIT_BINDGEN_VERSION: 0.62.0
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      # What the official installer does for one pinned release: the
      # toolchain tarball under ~/.moon, the core beside it, bundled for the
      # wasm and wasm-gc targets (the latter runs moon test), checksums
      # verified first. The '+' in the release is URL-encoded. Then what the
      # installer leaves to the user: moon update clones the registry index
      # that resolves moon.mod's moonbitlang/protobuf; without it moon check,
      # test and build fail with "module was not found in the registry"
      # (moonx needs no index, it fetches its pinned asset directly, which is
      # why gen-proto passes without one).
      - name: Setup MoonBit
        run: |
          version="${MOON_VERSION/+/%2B}"
          curl -fsSL -o "${RUNNER_TEMP}/moonbit.tar.gz" \
            "https://cli.moonbitlang.com/binaries/${version}/moonbit-linux-x86_64.tar.gz"
          echo "${MOON_SHA256}  ${RUNNER_TEMP}/moonbit.tar.gz" | sha256sum -c -
          curl -fsSL -o "${RUNNER_TEMP}/core.tar.gz" \
            "https://cli.moonbitlang.com/cores/core-${version}.tar.gz"
          echo "${MOON_CORE_SHA256}  ${RUNNER_TEMP}/core.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.moon/lib"
          tar -xzf "${RUNNER_TEMP}/moonbit.tar.gz" -C "${HOME}/.moon"
          tar -xzf "${RUNNER_TEMP}/core.tar.gz" -C "${HOME}/.moon/lib"
          chmod +x "${HOME}/.moon/bin/"* "${HOME}/.moon/bin/internal/tcc"
          ln -sfn moon "${HOME}/.moon/bin/moonx"
          export PATH="${HOME}/.moon/bin:${PATH}"
          moon -C "${HOME}/.moon/lib/core" bundle --warn-list -a --all
          moon -C "${HOME}/.moon/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          moon update
          echo "${HOME}/.moon/bin" >> "$GITHUB_PATH"
          moon version --all

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # protoc-gen-mbt is not installed: the Makefile runs the pinned release
      # through moonx, which fetches it into ~/.moon's registry.
      - name: Check Generated Codec
        working-directory: examples/hello-moonbit
        run: |
          make gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-moonbit/src/fnv1 is not up to date with its proto; commit the result of make gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Setup wit-bindgen
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/wit-bindgen.tar.gz" \
            "https://github.com/bytecodealliance/wit-bindgen/releases/download/v${WIT_BINDGEN_VERSION}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux.tar.gz"
          echo "${WIT_BINDGEN_SHA256}  ${RUNNER_TEMP}/wit-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/wit-bindgen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wit-bindgen-${WIT_BINDGEN_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check Generated Bindings
        working-directory: examples/hello-moonbit
        run: |
          make gen-bindings
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-moonbit/src bindings are not up to date with its wit; commit the result of make gen-bindings:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build, Lint and Test the MoonBit Guest
        run: make -C examples/hello-moonbit build lint test

  # The TypeScript guest, an ABI v2 component (jco): the policy-gate use
  # case.
  build-ts:
    name: build (ts)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache-dependency-path: examples/policy-gate/package-lock.json

      - name: Build and Test the TypeScript Guest
        run: make -C examples/policy-gate build test

  # The Python guest, an ABI v2 component (componentize-py): the team-tags
  # use case.
  build-python:
    name: build (python)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      - name: Build and Test the Python Guest
        run: make -C examples/team-tags build test

  # The C# guest, an ABI v2 component from componentize-dotnet: the
  # dashboard-bundle use case.
  build-dotnet:
    name: build (dotnet)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false

      # guestfn comes from build-tools; the Makefiles take it from GUESTFN
      # instead of building it.
      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt guestfn
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn" >> "$GITHUB_ENV"

      # NativeAOT-LLVM's linux-x64 compiler: the Makefile builds with the
      # host's dotnet here, no container.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Build, Lint and Test the C# Guest
        run: make -C examples/dashboard-bundle build lint test

  # The Kubernetes-native end-to-end suite (crates/e2e, docs/project/testing.md):
  # a kind cluster with Crossplane at CROSSPLANE_VERSION, provider-nop, the
  # suite's registry and this tree's runtime installed as a Function - the
  # prebuilt binary from build-tools wrapped by Dockerfile.dev - and the
  # three runtime profiles' suites in turn on that one cluster. The
  # submodule's make library pins kind, kubectl, helm and the crossplane
  # CLI, so nothing is installed by hand here. On failure the cluster's
  # state and the suite's own logs are uploaded.
  e2e-cluster:
    name: e2e (cluster)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      CROSSPLANE_VERSION: '2.4.3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.start.outputs.ref }}
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function"
          echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function" >> "$GITHUB_ENV"

      - name: Bring the Cluster Up
        run: make e2e.up

      - name: Run the Default Profile
        run: make e2e.test.default

      - name: Run the Strict Profile
        run: make e2e.test.strict

      - name: Run the Lifecycle Profile
        run: make e2e.test.lifecycle

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cluster-dump
          path: |
            _output/controlplane-dump
            _output/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the Cluster Down
        if: always()
        run: make e2e.down

  # One commit status carries the verdict back to the PR.
  report:
    runs-on: ubuntu-26.04
    needs: [start, guest-suite, build-go, build-rust, build-zig, build-c, build-odin, build-moonbit, build-ts, build-python, build-dotnet, e2e-cluster]
    if: always() && needs.start.result == 'success'
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report the Result
        run: |
          state=success
          description="all jobs passed"
          for result in "${{ needs.guest-suite.result }}" "${{ needs.build-go.result }}" \
            "${{ needs.build-rust.result }}" \
            "${{ needs.build-zig.result }}" "${{ needs.build-c.result }}" \
            "${{ needs.build-odin.result }}" "${{ needs.build-moonbit.result }}" "${{ needs.build-ts.result }}" \
            "${{ needs.build-python.result }}" "${{ needs.build-dotnet.result }}" \
            "${{ needs.e2e-cluster.result }}"; do
            if [ "$result" != "success" ]; then
              state=failure
              description="at least one job did not pass"
            fi
          done
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ needs.start.outputs.sha }}" \
              -f state="$state" -f context=e2e -f description="$description" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          # The run itself carries the verdict too, for a dispatched run.
          [ "$state" = success ]
