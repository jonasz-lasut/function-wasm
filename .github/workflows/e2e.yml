          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the C# Guest
        run: make -C examples/dashboard-bundle render-check

  # One commit status carries the verdict back to the PR.
  # The OCI path end to end at the render tier (test/e2e/oci, issue #112): a
  # module in a registry behind basic auth, signed with cosign, chosen by the
  # composite resource through module.from, pulled by digest with a step
  # credential, fenced by pullModule and verified under requireSignature.
  e2e-oci:
    name: e2e (oci)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      # These environment variables are important to the Crossplane CLI
      # install.sh script. They determine what version it installs.
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      - name: Download the Runtime, guestfn and xprin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tools
          path: ${{ runner.temp }}/e2e-tools

      - name: Use the Prebuilt Runtime, guestfn and xprin
        run: |
          chmod +x "${RUNNER_TEMP}/e2e-tools/function" "${RUNNER_TEMP}/e2e-tools/guestfn" \
            "${RUNNER_TEMP}/e2e-tools/xprin"
          {
            echo "FUNCTION_BIN=${RUNNER_TEMP}/e2e-tools/function"
            echo "GUESTFN=${RUNNER_TEMP}/e2e-tools/guestfn"
            echo "XPRIN=${RUNNER_TEMP}/e2e-tools/xprin"
          } >> "$GITHUB_ENV"

      # The module under test is examples/pdb-addon.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/pdb-addon/go.mod

      # The scenario signs offline (no Rekor upload), with flags cosign 3.1
      # takes.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Run the OCI Scenario
        run: test/e2e/oci/run.sh

  report:
    runs-on: ubuntu-26.04
    needs: [start, guest-suite, render-go, render-rust, render-zig, render-c, render-odin, render-moonbit, render-ts, render-python, render-dotnet, e2e-oci]
    if: always() && needs.start.result == 'success'
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report the Result
        run: |
          state=success
          description="all jobs passed"
          for result in "${{ needs.guest-suite.result }}" "${{ needs.render-go.result }}" \
            "${{ needs.render-rust.result }}" \
            "${{ needs.render-zig.result }}" "${{ needs.render-c.result }}" \
            "${{ needs.render-odin.result }}" "${{ needs.render-moonbit.result }}" "${{ needs.render-ts.result }}" \
            "${{ needs.render-python.result }}" "${{ needs.render-dotnet.result }}" \
            "${{ needs.e2e-oci.result }}"; do
            if [ "$result" != "success" ]; then
              state=failure
              description="at least one job did not pass"
            fi
          done
          gh api "repos/${{ github.repository }}/statuses/${{ needs.start.outputs.sha }}" \
            -f state="$state" -f context=e2e -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
