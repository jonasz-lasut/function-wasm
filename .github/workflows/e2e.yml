  # The C# guest, an ABI v2 component from componentize-dotnet: the
  # dashboard-bundle use case, which fetches a pinned zip archive over the
  # host's egress from a fixture server render.sh starts and unpacks it into
  # its private /tmp, under example/policy.cedar.
  render-dotnet:
    name: render (dotnet)
    runs-on: ubuntu-26.04
    needs:
      - start
      - build-tools
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.5.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          persist-credentials: false

      # The runtime, guestfn and xprin come from build-tools; render.sh and
      # the Makefiles take them from FUNCTION_BIN, GUESTFN and XPRIN instead
      # of building or installing them.
      - name: Download the Runtime, guestfn and xprin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
