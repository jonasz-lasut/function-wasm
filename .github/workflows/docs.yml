# The documentation site: the mdBook under docs/ (book.toml at the root,
# docs/SUMMARY.md the table of contents), published to GitHub Pages at
# https://jonasz-lasut.github.io/function-wasm/. A pull request that touches
# the book or the README builds it and checks every internal link and anchor
# of the rendered site; a push to main builds and deploys it.
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      # mdBook, installed from the release tarball and checked against its
      # digest (a cargo install would compile it on every run); the version
      # is the one the book is written for - bump both lines together.
      MDBOOK_VERSION: 0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/mdbook"
          tar -xzf "${RUNNER_TEMP}/mdbook.tar.gz" -C "${RUNNER_TEMP}/mdbook"
          echo "${RUNNER_TEMP}/mdbook" >> "$GITHUB_PATH"

      - name: Build the Book
        run: mdbook build

      # Offline: only the links between the rendered pages and their anchors
      # (--include-fragments), plus the README's relative links into the
      # tree; nothing on the network is dialled, so the check is as
      # deterministic as the build. The 404 page links by site-url-absolute
      # paths that only exist once deployed, so it is left out.
      - name: Check Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --include-fragments
            --no-progress
            --exclude-path book/404.html
            'book/**/*.html'
            README.md
          fail: true
          failIfEmpty: true

      - name: Upload the Site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
