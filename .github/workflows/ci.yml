name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.json", "**.svg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  # cargo test covers the whole workspace: the engine's WAT-fixture tests,
  # the runtime's unit and integration tests (the raw-client transparency
  # proof included), the conformance goldens - recorded the day the output
  # last diffed byte-identical against the Go runtime - and guestfn's
  # scaffold goldens, the render-matches-the-examples lockstep and its
  # CLI tests against an in-memory registry. The five-guest suite runs the
  # guests whose toolchains are on the runner (Go is preinstalled; the rest
  # are proven end to end by the render jobs) and skips the others.
  unit-test:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/hello-go/go.mod

      - name: Run Tests
        run: cargo test --workspace --locked

  # The example guest is the scaffold rendered for itself. Rendering it with
  # crossplane render against the runtime built from this tree proves the
  # whole chain: guest compiles to wasm, the runtime serves it over gRPC,
  # Crossplane accepts the response.
  render-go:
    name: render (go)
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    env:
      # These environment variables are important to the Crossplane CLI
      # install.sh script. They determine what version it installs.
      XP_CHANNEL: stable
      XP_VERSION: 'v2.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runtime the render runs against, and guestfn, are built from
      # this tree.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/hello-go/go.mod

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Vet and Test the Example Guest
        working-directory: examples/hello-go
        run: |
          go vet ./...
          go test -race ./...

      - name: Render the Example
        run: make -C examples/hello-go render-check

  # The same guest without function-sdk-go, built with TinyGo: protobuf-go
  # message types plus vtprotobuf's reflection-free codecs, generated from the
  # vendored proto and committed (regenerated here to catch drift), then
  # rendered through the runtime.
  render-tinygo:
    name: render (tinygo)
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/hello-tinygo/go.mod

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: '0.41.1'

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # make generate builds the protoc plugins from go.mod's tool directives.
      - name: Check Generated Code
        working-directory: examples/hello-tinygo
        run: |
          go mod tidy
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-tinygo is not up to date with its proto or go.mod; commit the result of make generate:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Test the TinyGo Guest
        working-directory: examples/hello-tinygo
        run: go test -race ./...

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the TinyGo Guest
        run: make -C examples/hello-tinygo render-check

  # The same guest in Rust (prost over the vendored proto, cdylib for
  # wasm32-wasip1), rendered through the runtime.
  render-rust:
    name: render (rust)
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and Test the Rust Guest
        working-directory: examples/hello-rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip1 -- -D warnings
          cargo test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the Rust Guest
        run: make -C examples/hello-rust render-check

  # The same guest in Zig (zig-protobuf over the vendored proto), rendered
  # through the runtime. One zig binary builds it; protoc is only needed to
  # regenerate the checked-in codec, which zig build gen-proto downloads.
  render-zig:
    name: render (zig)
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check Generated Codec
        working-directory: examples/hello-zig
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-zig/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Lint and Test the Zig Guest
        working-directory: examples/hello-zig
        run: |
          zig fmt --check build.zig src/main.zig
          zig build test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the Zig Guest
        run: make -C examples/hello-zig render-check

  # The same guest in C (nanopb over the vendored proto), compiled by zig cc
  # behind its build.zig, rendered through the runtime. The same zig binary
  # builds it; nanopb_generator (and protoc) are only needed to regenerate the
  # checked-in codec.
  render-c:
    name: render (c)
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    env:
      XP_CHANNEL: stable
      XP_VERSION: 'v2.4.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The nanopb version must match the one the checked-in codec was
      # generated with (its header names it) and the one build.zig fetches.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Setup nanopb_generator
        run: pip install nanopb==0.4.9.1

      - name: Check Generated Codec
        working-directory: examples/hello-c
        run: |
          zig build gen-proto
          if [ -n "$(git status --porcelain)" ]; then
            echo "examples/hello-c/src/fnv1 is not up to date with its proto; commit the result of zig build gen-proto:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Lint and Test the C Guest
        working-directory: examples/hello-c
        run: |
          zig fmt --check build.zig
          zig build test

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Render the C Guest
        run: make -C examples/hello-c render-check
