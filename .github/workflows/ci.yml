name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.json", "**.svg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  lint:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust Builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  # cargo test covers the whole workspace: the engine's WAT-fixture tests,
  # the runtime's unit and integration tests (the raw-client transparency
  # proof included), the conformance goldens - recorded the day the output
  # last diffed byte-identical against the Go runtime - and guestfn's
  # scaffold goldens, the render-matches-the-examples lockstep and its
  # CLI tests against an in-memory registry. The job is deliberately
  # toolchain-free: SKIP_GUEST_BUILDS turns the guest suite off (the
  # runner's preinstalled Go would otherwise build the go guest with an
  # unpinned toolchain) - each guest is proven end to end by its render job
  # and the full behavioural matrix by the guest-suite job, both in the
  # comment-triggered e2e workflow (/e2e on a pull request).
  unit-test:
    runs-on: ubuntu-24.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Rust Builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Tests
        env:
          SKIP_GUEST_BUILDS: '1'
        run: cargo test --workspace --locked
