name: Grype Vulnerability Scan

on:
  schedule:
    # Monday 05:00 UTC (6:00 AM CET / 7:00 AM CEST). GitHub Actions cron is
    # always UTC, so this drifts an hour during CEST.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  # The same advisories check ci.yml runs on a pull request, weekly against
  # main's Cargo.lock, so an advisory published between pull requests is
  # seen within the week.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # The latest release image of each function. Grype reads the package
  # metadata of the images' base: it sees no crate inside the Rust binaries
  # (the advisories job covers those) and neither the Firecracker binary
  # nor the guest kernel of function-oci's image (SECURITY.md).
  scan:
    name: Scan ${{ matrix.function }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A function with no release says nothing about the other's image.
      fail-fast: false
      matrix:
        include:
          # Each function files its results under its own code scanning
          # category, so neither replaces the other's on a tag they share.
          # function-wasm keeps the category its analyses had before the
          # matrix (the job's key), so its open alerts stay one
          # configuration.
          - function: function-wasm
            category: .github/workflows/grype-scan.yml:scan
          - function: function-oci
            category: .github/workflows/grype-scan.yml:scan/function-oci

    steps:
      - name: Find Latest Release Image
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUNCTION: ${{ matrix.function }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The repository's releases are per component, so "the latest
          # release" says nothing about one function: the newest
          # <function>-vX.Y.Z release is its own. The image is tagged with
          # the version alone, and the results go to the git tag.
          TAG=$(gh release list --repo "${REPOSITORY}" --limit 200 --json tagName -q '.[].tagName' \
            | grep -E "^${FUNCTION}-v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1 || true)
          if [ -z "${TAG}" ]; then
            echo "::notice title=No ${FUNCTION} release::${FUNCTION} has no release to scan yet"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA=$(gh api repos/"${REPOSITORY}"/commits/"${TAG}" --jq .sha)
          {
            echo "found=true"
            echo "tag=${TAG}"
            echo "version=${TAG#"${FUNCTION}-"}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Grype
        if: steps.release.outputs.found == 'true'
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype-install

      - name: Scan Latest Release Image
        if: steps.release.outputs.found == 'true'
        run: |
          ${{ steps.grype-install.outputs.cmd }} ghcr.io/jonasz-lasut/${{ matrix.function }}:${{ steps.release.outputs.version }} \
            -o table \
            -o sarif=grype-results.sarif

      - name: Upload SARIF Report
        if: steps.release.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype-results.sarif
          ref: refs/tags/${{ steps.release.outputs.tag }}
          sha: ${{ steps.release.outputs.sha }}
          category: ${{ matrix.category }}