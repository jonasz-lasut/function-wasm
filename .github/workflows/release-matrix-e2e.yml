# The release matrix (#189, docs/project/testing.md): the end-to-end cluster
# suite (`make e2e E2E_OCI=1`: kind, Crossplane, provider-nop, the registry,
# both packages built from this ref, every profile of both runtimes,
# teardown) run once per Crossplane minor the project supports, in parallel
# on three runners. Both functions leave through Publish Function, so the
# gate covers both on every leg: function-wasm from the runtime build-tools
# hands over, function-oci from the pieces build-oci hands over (the
# runtime with its oci engine, the init, the pinned Firecracker and kernel,
# the test module as a process), under the udev rule that gives the
# runner's kind node /dev/kvm. One cluster per minor runs both runtimes:
# the gate asks whether the release works on that Crossplane, and a leg per
# runtime would double the runners for no new proof. Crossplane maintains
# its three most recent minor releases
# (docs.crossplane.io/latest/learn/release-cycle), so the matrix is the
# current one - the Makefile's CROSSPLANE_VERSION default, what every /e2e
# run tests - and the latest patch of the two minors before it, pinned
# below. The OCI engine's VM suite runs beside it on nine pairs: the three
# most recent Firecracker minors against the three guest kernel lines
# Firecracker supports (docs/kernel-policy.md upstream). The pair the image
# pins blocks the release, and any other pair that fails stays out of the
# record a last job writes for the tested-versions tables in README.md.
# Nothing else runs here: the guest suite and the example build jobs depend
# on neither.
# Runs on every push to a release-function-<wasm|oci>-X.Y branch: the cut of a new line (the
# cut-release skill pushes the branch, waits for this run and cuts the tag
# only when it is green) and a patch on an existing one (remediate-cves).
# A red version is a release blocker, or the floor the documentation then
# states. It can also be started by hand on any ref, to try the matrix
# itself:
#   gh workflow run "Release Matrix E2E" --ref main
# A trusted ref runs here, so the Rust builds use rust-cache's default
# prefix like ci.yml, never the e2e- namespace e2e.yml's pull-request code
# writes.
name: Release Matrix E2E

on:
  push:
    branches:
      - 'release-function-*'
  workflow_dispatch:

permissions:
  contents: read

# The two older minors. Renovate moves each to the latest patch of its own
# minor only (renovate.json5: a minor or major update of these pins is
# disabled); when a new Crossplane minor ships, Renovate's PR for the
# Makefile's CROSSPLANE_VERSION is the signal to shift both pins down one
# minor by hand in the same PR.
env:
  # renovate: datasource=github-releases depName=crossplane/crossplane
  CROSSPLANE_PREVIOUS: '2.3.7'
  # renovate: datasource=github-releases depName=crossplane/crossplane
  CROSSPLANE_OLDEST: '2.2.7'
  # The two older Firecracker minors, moved by Renovate within their own
  # minor only. Renovate's PR moving the Dockerfile to a new minor is the
  # signal to shift both down one minor by hand in the same PR.
  # renovate: datasource=github-releases depName=firecracker-microvm/firecracker
  FIRECRACKER_PREVIOUS: '1.17.0'
  # renovate: datasource=github-releases depName=firecracker-microvm/firecracker
  FIRECRACKER_OLDEST: '1.16.2'
  # The two older guest kernel lines, x86_64 like the runners, from the
  # artifact prefix the Dockerfile's KERNEL_CI pins. That bucket publishes no
  # checksums, so these move by hand with KERNEL_CI.
  KERNEL_PREVIOUS: '6.1.188'
  KERNEL_PREVIOUS_SHA256: '31fe88d6c72b93d5c9c63cca599ccadec49fd35673bbfd04850d6c00ff27f032'
  KERNEL_OLDEST: '5.10.271'
  KERNEL_OLDEST_SHA256: '38d9d7a4096e95df6d236c6372e5b8f8928892503517cb723187c31cc418bc74'

jobs:
  # The release runtime, built once and handed to every cluster job.
  build-tools:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # A release branch's own cache; a workflow_dispatch run on another
          # ref restores it and saves nothing (ci.yml says why).
          save-if: ${{ startsWith(github.ref, 'refs/heads/release-') }}

      - name: Build the Runtime and guestfn
        run: cargo build --locked --release -p function-wasm -p guestfn

      - name: Upload the Runtime and guestfn
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-matrix-tools
          path: |
            target/release/function-wasm
            target/release/guestfn
          if-no-files-found: error
          retention-days: 1

  # The OCI runtime's pieces (docs/one-pager-oci-runtime.md), built once
  # and handed to every cluster job beside the wasm runtime: the runtime
  # with its oci engine, the init (static, musl), the end-to-end guest as
  # a process, and the pinned Firecracker and guest kernel. e2e.yml's
  # build-oci is the model; the fixture and the engine's VM suite stay
  # there, since the matrix proves the packages on each Crossplane, not
  # the engine.
  build-oci:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # The end-to-end guest's prost-build shells out to protoc, which the
      # runner image does not ship.
      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # A release branch's own cache; a workflow_dispatch run on another
          # ref restores it and saves nothing (ci.yml says why).
          save-if: ${{ startsWith(github.ref, 'refs/heads/release-') }}

      - name: Fetch Firecracker and the Guest Kernel
        run: make oci.tools

      - name: Build the Runtime and the Init
        run: |
          cargo build --locked --release -p function-oci
          cargo build --locked --release -p guestfn-init --target x86_64-unknown-linux-musl

      # function-sdk-rust's TLS (aws-lc) has a C half that builds with
      # musl-gcc: the fixture and the end-to-end guest link it.
      - name: Install the musl Toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build the End-to-End Guest as a Process
        run: make e2e.oci.guest

      - name: Collect the Tools
        run: |
          mkdir -p "${RUNNER_TEMP}/release-matrix-oci-tools"
          cp target/release/function-oci "${RUNNER_TEMP}/release-matrix-oci-tools/function"
          cp target/x86_64-unknown-linux-musl/release/guestfn-init "${RUNNER_TEMP}/release-matrix-oci-tools/init"
          cp .cache/tools/oci/firecracker .cache/tools/oci/vmlinux "${RUNNER_TEMP}/release-matrix-oci-tools/"
          cp crates/e2e/guest/target/x86_64-unknown-linux-musl/release/e2e-guest-oci "${RUNNER_TEMP}/release-matrix-oci-tools/"

      - name: Upload the Tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-matrix-oci-tools
          path: ${{ runner.temp }}/release-matrix-oci-tools
          if-no-files-found: error
          retention-days: 1

  # One kind cluster per Crossplane version, all three at once, with both
  # functions installed on each (E2E_OCI=1: the udev rule gives the
  # runner's kind node /dev/kvm). `current` leaves CROSSPLANE_VERSION to
  # the Makefile's default; the other two set it from the pins above.
  e2e:
    name: e2e (crossplane ${{ matrix.crossplane }})
    runs-on: ubuntu-26.04
    needs:
      - build-tools
      - build-oci
    strategy:
      fail-fast: false
      matrix:
        crossplane: [current, previous, oldest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the Runtime and guestfn
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-matrix-tools
          path: ${{ runner.temp }}/release-matrix-tools

      - name: Download the OCI Tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-matrix-oci-tools
          path: ${{ runner.temp }}/release-matrix-oci-tools

      - name: Use the Prebuilt Tools
        run: |
          chmod +x "${RUNNER_TEMP}/release-matrix-tools/function-wasm" "${RUNNER_TEMP}"/release-matrix-oci-tools/*
          {
            echo "FUNCTION_BIN=${RUNNER_TEMP}/release-matrix-tools/function-wasm"
            echo "FUNCTION_OCI_TOOLS=${RUNNER_TEMP}/release-matrix-oci-tools"
            echo "E2E_OCI_GUEST=${RUNNER_TEMP}/release-matrix-oci-tools/e2e-guest-oci"
          } >> "$GITHUB_ENV"

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # A release branch's own cache; a workflow_dispatch run on another
          # ref restores it and saves nothing (ci.yml says why).
          save-if: ${{ startsWith(github.ref, 'refs/heads/release-') }}

      - name: Select the Crossplane Version
        run: |
          case "${{ matrix.crossplane }}" in
            current) version="$(make -s -f Makefile print-crossplane-version)" ;;
            previous) version="$CROSSPLANE_PREVIOUS"; echo "CROSSPLANE_VERSION=$version" >> "$GITHUB_ENV" ;;
            oldest) version="$CROSSPLANE_OLDEST"; echo "CROSSPLANE_VERSION=$version" >> "$GITHUB_ENV" ;;
          esac
          echo "crossplane=$version" >> "$GITHUB_OUTPUT"
          echo "Crossplane $version (${{ matrix.crossplane }})"
        id: select

      - name: Run the Suite
        run: make e2e E2E_OCI=1

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-matrix-dump-${{ matrix.crossplane }}
          path: |
            _output/controlplane-dump
            _output/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the Cluster Down
        if: always()
        run: make e2e.down

      - name: Summarize
        if: always()
        run: |
          echo "- Crossplane ${{ steps.select.outputs.crossplane }} (${{ matrix.crossplane }}), function-wasm and function-oci: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # Only the pair the image pins blocks a release. Another pair that fails
  # uploads no record of itself, so it stays out of the table.
  vm-suite:
    name: vm suite (firecracker ${{ matrix.firecracker }}, kernel ${{ matrix.kernel }})
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.firecracker != 'current' || matrix.kernel != 'current' }}
    strategy:
      fail-fast: false
      matrix:
        firecracker: [current, previous, oldest]
        kernel: [current, previous, oldest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ startsWith(github.ref, 'refs/heads/release-') }}

      - name: Install the musl Toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Select the Firecracker Release and the Guest Kernel
        id: select
        run: |
          firecracker=$(sed -nE 's/^ARG FIRECRACKER_VERSION=v//p' crates/function-oci/Dockerfile | head -n 1)
          kernel=$(sed -nE 's/^ARG KERNEL_VERSION=//p' crates/function-oci/Dockerfile | head -n 1)
          case "${{ matrix.firecracker }}" in
            previous) firecracker=$FIRECRACKER_PREVIOUS ;;
            oldest) firecracker=$FIRECRACKER_OLDEST ;;
          esac
          case "${{ matrix.kernel }}" in
            previous) kernel=$KERNEL_PREVIOUS; sha=$KERNEL_PREVIOUS_SHA256 ;;
            oldest) kernel=$KERNEL_OLDEST; sha=$KERNEL_OLDEST_SHA256 ;;
            *) sha= ;;
          esac
          echo "OCI_FIRECRACKER_VERSION=v${firecracker}" >> "$GITHUB_ENV"
          if [ -n "$sha" ]; then
            echo "OCI_KERNEL_VERSION=${kernel}" >> "$GITHUB_ENV"
            echo "OCI_KERNEL_SHA256=${sha}" >> "$GITHUB_ENV"
          fi
          echo "firecracker=${firecracker}" >> "$GITHUB_OUTPUT"
          echo "kernel=${kernel}" >> "$GITHUB_OUTPUT"

      - name: Run the Engine Suite in VMs
        env:
          GUESTFN_REQUIRE_KVM: "1"
        run: make oci.test

      - name: Record the Pair
        env:
          FIRECRACKER: ${{ steps.select.outputs.firecracker }}
          KERNEL: ${{ steps.select.outputs.kernel }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pair"
          jq -n --arg firecracker "$FIRECRACKER" --arg kernel "$KERNEL" \
            '{firecracker: $firecracker, kernel: $kernel}' > "${RUNNER_TEMP}/pair/pair.json"

      - name: Upload the Pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-pair-${{ matrix.firecracker }}-${{ matrix.kernel }}
          path: ${{ runner.temp }}/pair/pair.json
          if-no-files-found: error

  # What the legs above passed, for hack/tested-versions.sh. The release
  # skills read it once a release is out and open the pull request that
  # updates the table.
  tested-versions:
    name: record the tested versions
    runs-on: ubuntu-26.04
    needs:
      - e2e
      - vm-suite
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Passing Pairs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-pair-*
          path: pairs

      - name: Write the Record
        run: |
          crossplane=$(sed -nE 's/^CROSSPLANE_VERSION \?= //p' Makefile)
          vms=$(jq -s 'sort_by((.firecracker | split(".") | map(tonumber)), (.kernel | split(".") | map(tonumber))) | reverse' pairs/*/pair.json)
          jq -n \
            --arg c1 "$crossplane" --arg c2 "$CROSSPLANE_PREVIOUS" --arg c3 "$CROSSPLANE_OLDEST" \
            --argjson vms "$vms" \
            '{crossplane: [$c1, $c2, $c3], vms: $vms}' > tested-versions.json
          cat tested-versions.json

      - name: Upload the Record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-versions
          path: tested-versions.json
          if-no-files-found: error
