# The release matrix (#189, docs/project/testing.md): what one function's
# release must pass on every version it claims to support, read from the
# branch's name. A push to release-function-wasm-X.Y runs every wasm
# profile of the end-to-end cluster suite on the three Crossplane minors the
# project supports, and no VM. A push to release-function-oci-X.Y runs every
# oci profile on the same three, and the OCI engine's VM suite on nine
# pairs. Neither runs the other function's scenarios: they test nothing the
# branch releases.
#
# The cluster jobs are e2e-wasm.yml's and e2e-oci.yml's, the workflows a
# pull request's labels select from (e2e.yml), called once with the three
# versions: the runtime is built once, and every profile is a job of its
# own on a kind cluster of its own per version, nine in parallel. Crossplane
# maintains its three most recent minor releases
# (docs.crossplane.io/latest/learn/release-cycle), so the versions are the
# current one - the Makefile's CROSSPLANE_VERSION default, what a pull
# request's run tests - and the latest patch of the two minors before it,
# pinned below. The nine VM pairs are the three most recent Firecracker
# minors against the three guest kernel lines Firecracker supports
# (docs/kernel-policy.md upstream). The pair the image pins blocks the
# release, and any other pair that fails stays out of the record a last job
# writes for the function's tested-versions table in README.md.
# Nothing else runs here: the guest suite and the example build jobs depend
# on neither.
# Runs on every push to a release-function-<wasm|oci>-X.Y branch: the cut of a new line (the
# cut-release skill pushes the branch, waits for this run and cuts the tag
# only when it is green) and a patch on an existing one (remediate-cves).
# A red version is a release blocker, or the floor the documentation then
# states. It can also be started by hand on any ref, to try the matrix
# itself, naming the runtime the branch would have:
#   gh workflow run "Release Matrix E2E" --ref main -f runtime=wasm
# No run here saves a cache: a release branch reads main's (whole at the cut,
# when the branch is main's head, and as a base once Cargo.lock differs),
# and a copy in the branch's own scope would be read by the next push to
# that branch alone, usually after its week of life, while counting against
# the 10 GiB that main's caches share.
name: Release Matrix E2E

on:
  push:
    branches:
      - 'release-function-wasm-*'
      - 'release-function-oci-*'
  workflow_dispatch:
    inputs:
      runtime:
        description: The runtime whose matrix runs, as a release branch's name would state it
        type: choice
        options:
          - wasm
          - oci
        required: true

permissions:
  contents: read

# The two older minors. Renovate moves each to the latest patch of its own
# minor only (renovate.json5: a minor or major update of these pins is
# disabled); when a new Crossplane minor ships, Renovate's PR for the
# Makefile's CROSSPLANE_VERSION is the signal to shift both pins down one
# minor by hand in the same PR.
env:
  # renovate: datasource=github-releases depName=crossplane/crossplane
  CROSSPLANE_PREVIOUS: '2.3.7'
  # renovate: datasource=github-releases depName=crossplane/crossplane
  CROSSPLANE_OLDEST: '2.2.7'
  # The two older Firecracker minors, moved by Renovate within their own
  # minor only. Renovate's PR moving the Dockerfile to a new minor is the
  # signal to shift both down one minor by hand in the same PR.
  # renovate: datasource=github-releases depName=firecracker-microvm/firecracker
  FIRECRACKER_PREVIOUS: '1.17.0'
  # renovate: datasource=github-releases depName=firecracker-microvm/firecracker
  FIRECRACKER_OLDEST: '1.16.2'
  # The two older guest kernel lines, x86_64 like the runners, from the
  # artifact prefix the Dockerfile's KERNEL_CI pins. That bucket publishes no
  # checksums, so these move by hand with KERNEL_CI.
  KERNEL_PREVIOUS: '6.1.188'
  KERNEL_PREVIOUS_SHA256: '31fe88d6c72b93d5c9c63cca599ccadec49fd35673bbfd04850d6c00ff27f032'
  KERNEL_OLDEST: '5.10.271'
  KERNEL_OLDEST_SHA256: '38d9d7a4096e95df6d236c6372e5b8f8928892503517cb723187c31cc418bc74'

jobs:
  # The runtime the branch releases, and the three Crossplane versions as
  # the JSON array the called workflow takes: a `with:` cannot read `env`,
  # so the pins above reach it as this job's output.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      crossplane: ${{ steps.plan.outputs.crossplane }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Branch and the Pins
        id: plan
        env:
          RUNTIME_INPUT: ${{ inputs.runtime }}
        run: |
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF_NAME}" in
            workflow_dispatch:*) runtime="$RUNTIME_INPUT" ;;
            push:release-function-wasm-*) runtime=wasm ;;
            push:release-function-oci-*) runtime=oci ;;
            *) echo "::error::${GITHUB_REF_NAME} names no function's release branch"; exit 1 ;;
          esac
          current=$(sed -nE 's/^CROSSPLANE_VERSION \?= //p' Makefile)
          crossplane=$(jq -cn --arg c1 "$current" --arg c2 "$CROSSPLANE_PREVIOUS" --arg c3 "$CROSSPLANE_OLDEST" '[$c1, $c2, $c3]')
          {
            echo "runtime=${runtime}"
            echo "crossplane=${crossplane}"
          } | tee -a "$GITHUB_OUTPUT"
          echo "function-${runtime} on Crossplane ${crossplane}" >> "$GITHUB_STEP_SUMMARY"

  # Every wasm profile on each of the three versions, function-wasm alone
  # on every cluster.
  wasm:
    needs: plan
    if: needs.plan.outputs.runtime == 'wasm'
    uses: ./.github/workflows/e2e-wasm.yml
    with:
      crossplane-versions: ${{ needs.plan.outputs.crossplane }}

  # Every oci profile on each of the three versions, function-oci alone on
  # every cluster (the called workflow installs the udev rule that gives
  # the runner's kind node /dev/kvm).
  oci:
    needs: plan
    if: needs.plan.outputs.runtime == 'oci'
    uses: ./.github/workflows/e2e-oci.yml
    with:
      crossplane-versions: ${{ needs.plan.outputs.crossplane }}

  # function-oci's alone: no VM runs for a function-wasm release. Only the
  # pair the image pins blocks a release. Another pair that fails uploads
  # no record of itself, so it stays out of the table.
  vm-suite:
    name: vm suite (firecracker ${{ matrix.firecracker }}, kernel ${{ matrix.kernel }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: plan
    if: needs.plan.outputs.runtime == 'oci'
    continue-on-error: ${{ matrix.firecracker != 'current' || matrix.kernel != 'current' }}
    strategy:
      fail-fast: false
      matrix:
        firecracker: [current, previous, oldest]
        kernel: [current, previous, oldest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The key is the one ci.yml's job of this name saves on main.
      - name: Restore the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Install the musl Toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Select the Firecracker Release and the Guest Kernel
        id: select
        run: |
          firecracker=$(sed -nE 's/^ARG FIRECRACKER_VERSION=v//p' crates/function-oci/Dockerfile | head -n 1)
          kernel=$(sed -nE 's/^ARG KERNEL_VERSION=//p' crates/function-oci/Dockerfile | head -n 1)
          case "${{ matrix.firecracker }}" in
            previous) firecracker=$FIRECRACKER_PREVIOUS ;;
            oldest) firecracker=$FIRECRACKER_OLDEST ;;
          esac
          case "${{ matrix.kernel }}" in
            previous) kernel=$KERNEL_PREVIOUS; sha=$KERNEL_PREVIOUS_SHA256 ;;
            oldest) kernel=$KERNEL_OLDEST; sha=$KERNEL_OLDEST_SHA256 ;;
            *) sha= ;;
          esac
          echo "OCI_FIRECRACKER_VERSION=v${firecracker}" >> "$GITHUB_ENV"
          if [ -n "$sha" ]; then
            echo "OCI_KERNEL_VERSION=${kernel}" >> "$GITHUB_ENV"
            echo "OCI_KERNEL_SHA256=${sha}" >> "$GITHUB_ENV"
          fi
          echo "firecracker=${firecracker}" >> "$GITHUB_OUTPUT"
          echo "kernel=${kernel}" >> "$GITHUB_OUTPUT"

      - name: Run the Engine Suite in VMs
        env:
          GUESTFN_REQUIRE_KVM: "1"
        run: make oci.test

      - name: Record the Pair
        env:
          FIRECRACKER: ${{ steps.select.outputs.firecracker }}
          KERNEL: ${{ steps.select.outputs.kernel }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pair"
          jq -n --arg firecracker "$FIRECRACKER" --arg kernel "$KERNEL" \
            '{firecracker: $firecracker, kernel: $kernel}' > "${RUNNER_TEMP}/pair/pair.json"

      - name: Upload the Pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-pair-${{ matrix.firecracker }}-${{ matrix.kernel }}
          path: ${{ runner.temp }}/pair/pair.json
          if-no-files-found: error

  # What the released function passed, for hack/tested-versions.sh: the
  # three Crossplane versions, and for function-oci the VM pairs. The
  # release skills read it once a release is out and open the pull request
  # that updates the function's table. It is written only when everything
  # that blocks the release passed.
  tested-versions:
    name: record the tested versions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - plan
      - wasm
      - oci
      - vm-suite
    if: >-
      !cancelled()
      && (needs.wasm.result == 'success'
        || (needs.oci.result == 'success' && needs.vm-suite.result == 'success'))
    env:
      RUNTIME: ${{ needs.plan.outputs.runtime }}
      CROSSPLANE: ${{ needs.plan.outputs.crossplane }}
    steps:
      - name: Download the Passing Pairs
        if: needs.plan.outputs.runtime == 'oci'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-pair-*
          path: pairs

      - name: Write the Record
        run: |
          if [ "$RUNTIME" = oci ]; then
            vms=$(jq -s 'sort_by((.firecracker | split(".") | map(tonumber)), (.kernel | split(".") | map(tonumber))) | reverse' pairs/*/pair.json)
            jq -n --argjson crossplane "$CROSSPLANE" --argjson vms "$vms" \
              '{function: "function-oci", crossplane: $crossplane, vms: $vms}' > tested-versions.json
          else
            jq -n --argjson crossplane "$CROSSPLANE" \
              '{function: "function-wasm", crossplane: $crossplane}' > tested-versions.json
          fi
          cat tested-versions.json

      - name: Upload the Record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-versions
          path: tested-versions.json
          if-no-files-found: error
