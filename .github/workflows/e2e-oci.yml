# function-oci's end-to-end scenarios, called by e2e.yml (a pull request's
# labels select them, a push to main runs the builds alone) and by
# release-matrix-e2e.yml (every profile on each Crossplane version a
# function-oci release supports). The OCI runtime's pieces are built once;
# every selected profile of the Kubernetes-native suite (crates/e2e,
# docs/project/testing.md) is then a job of its own with a kind cluster of
# its own, and the process guest has a build job. The OCI engine's suite in
# real VMs is a cargo test with no cluster and runs in ci.yml.
#
# The caller's event decides the trust: the header of e2e.yml says what a
# pull request's run gets. Nothing here writes outside the runner, and a
# cache is saved only where the caller says so (save-caches), which no
# caller does for a pull request.
name: E2E (oci)

on:
  workflow_call:
    inputs:
      profiles:
        description: >-
          The oci profiles to run, each on a cluster of its own: all, or a
          JSON array of names ([] runs none).
        type: string
        default: all
      examples:
        description: Whether the process guest's build job runs.
        type: boolean
        default: false
      crossplane-versions:
        description: >-
          A JSON array of Crossplane versions (the chart's, no v); every
          profile runs on each. An empty string is the Makefile's
          CROSSPLANE_VERSION default.
        type: string
        default: '[""]'
      save-caches:
        description: >-
          Whether the jobs save their caches: true on a push to main or to a
          release branch, never for a pull request.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The OCI runtime's pieces (docs/one-pager-oci-runtime.md), built once
  # and handed to the profile jobs as one artifact: the runtime with its
  # oci engine, the init (static, musl), the end-to-end guest as a process,
  # and the pinned Firecracker and guest kernel. The OCI engine's own suite
  # in real VMs is ci.yml's vm-suite job.
  build-tools:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # The end-to-end guest's prost-build shells out to protoc.
      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-oci-tools
          cache-on-failure: true
          save-if: ${{ inputs.save-caches }}

      - name: Fetch Firecracker and the Guest Kernel
        run: make oci.tools

      # function-sdk-rust's TLS (aws-lc) has a C half that builds with
      # musl-gcc: the end-to-end guest links it.
      - name: Install the musl Toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # guestfn is e2e-wasm.yml's to build (its example jobs take it from
      # there), and nothing downstream of this job reads one.
      - name: Build the Runtime and the Init
        run: |
          cargo build --locked --release -p function-oci
          cargo build --locked --release -p guestfn-init --target x86_64-unknown-linux-musl

      - name: Build the End-to-End Guest as a Process
        run: make e2e.oci.guest

      - name: Collect the Tools
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e-oci-tools"
          cp target/release/function-oci "${RUNNER_TEMP}/e2e-oci-tools/function"
          cp target/x86_64-unknown-linux-musl/release/guestfn-init "${RUNNER_TEMP}/e2e-oci-tools/init"
          cp .cache/tools/oci/firecracker .cache/tools/oci/vmlinux "${RUNNER_TEMP}/e2e-oci-tools/"
          cp crates/e2e/guest/target/x86_64-unknown-linux-musl/release/e2e-guest-oci "${RUNNER_TEMP}/e2e-oci-tools/"

      - name: Upload the Tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-oci-tools
          path: ${{ runner.temp }}/e2e-oci-tools
          if-no-files-found: error
          retention-days: 1

  # One oci profile per job, each on a kind cluster of its own: kind,
  # Crossplane and the setup as e2e-wasm.yml's, then function-oci alone
  # (E2E_WASM=0 E2E_OCI=1: the node must have /dev/kvm, which the udev rule
  # gives the runner's kind node), driven through the Guest XR with the test
  # module as a process. build-tools' prebuilt pieces are wrapped into the
  # image, so nothing is compiled in Docker. On failure the cluster's state
  # and the suite's own logs are uploaded.
  e2e:
    name: ${{ format('e2e ({0}{1})', matrix.profile, matrix.crossplane && format(', crossplane {0}', matrix.crossplane) || '') }}
    runs-on: ubuntu-26.04
    needs:
      - build-tools
    # An empty matrix is an error, so no selected profile skips the job.
    if: inputs.profiles != '[]'
    strategy:
      fail-fast: false
      matrix:
        # The profiles `all` stands for are the Makefile's E2E_OCI_PROFILES.
        profile: ${{ fromJSON(inputs.profiles == 'all' && '["default", "privileges", "snapshots"]' || inputs.profiles) }}
        crossplane: ${{ fromJSON(inputs.crossplane-versions) }}
    env:
      # Through the environment, never into the script: a profile's name
      # comes from a label.
      PROFILE: ${{ matrix.profile }}
      CROSSPLANE: ${{ matrix.crossplane }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # The end-to-end crate's own build (the setup binary and the profile's
      # tests), under the one key every profile job of both runtimes
      # restores and e2e.yml's build-suite job saves on main. A profile job
      # saves nothing: a dozen of them would race for one key.
      - name: Restore the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e-suite
          save-if: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the OCI Tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-oci-tools
          path: ${{ runner.temp }}/e2e-oci-tools

      - name: Use the Prebuilt Tools
        run: |
          chmod +x "${RUNNER_TEMP}"/e2e-oci-tools/*
          {
            echo "FUNCTION_OCI_TOOLS=${RUNNER_TEMP}/e2e-oci-tools"
            echo "E2E_OCI_GUEST=${RUNNER_TEMP}/e2e-oci-tools/e2e-guest-oci"
          } >> "$GITHUB_ENV"

      - name: Select the Crossplane Version
        if: matrix.crossplane != ''
        run: echo "CROSSPLANE_VERSION=${CROSSPLANE}" >> "$GITHUB_ENV"

      - name: Bring the Cluster Up
        run: make e2e.up E2E_WASM=0 E2E_OCI=1

      - name: Run the Profile
        run: make "e2e.oci-profile.${PROFILE}"

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('e2e-oci-dump-{0}{1}', matrix.profile, matrix.crossplane && format('-{0}', matrix.crossplane) || '') }}
          path: |
            _output/controlplane-dump
            _output/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the Cluster Down
        if: always()
        run: make e2e.down

  # The Go process guest, an oci@0.1 module: the function-oci-go hello, the
  # image function-oci boots. Go vets and tests it natively; the image is
  # built, never pushed, to prove the Dockerfile.
  build-oci-go:
    name: build (oci-go)
    runs-on: ubuntu-26.04
    if: inputs.examples
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: examples/function-oci-go/go.mod

      - name: Restore the Go Modules and Build
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: examples-oci-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/function-oci-go/go.sum') }}
          restore-keys: |
            examples-oci-go-${{ runner.os }}-${{ runner.arch }}-

      - name: Vet and Test the Process Guest
        working-directory: examples/function-oci-go
        run: |
          go vet ./...
          go test -race ./...

      - name: Build the Image
        run: docker build -t function-oci-go:ci examples/function-oci-go

      - name: Save the Go Modules and Build
        if: inputs.save-caches && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.deps.outputs.cache-primary-key }}
