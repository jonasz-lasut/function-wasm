# The OCI runtime's workflow (docs/one-pager-oci-runtime.md): the engine's
# tests over a real Firecracker VM and the end-to-end suite's oci profile,
# the function-oci package in a kind cluster with /dev/kvm. It runs on a
# push to any branch that touches the runtime, unlike e2e.yml's /e2e,
# whose issue_comment run reads the workflow file from main: a change to
# the OCI runtime is proved by its own branch's push, before it merges.
# GitHub's Linux runners expose KVM to a udev rule, which the jobs below
# install.
name: OCI Runtime

on:
  push:
    paths:
      - crates/engine-api/**
      - crates/engine-oci/**
      - crates/init/**
      - crates/function/**
      - crates/e2e/**
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.oci
      - Dockerfile.oci.dev
      - package/oci/**
      - Makefile
      - .github/workflows/e2e-oci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The runtime with its oci engine, guestfn, the init and the fixture
  # (static, musl), the end-to-end guest as a process, and the pinned
  # Firecracker and kernel, handed to the jobs below as one artifact.
  build-oci:
    name: build (oci)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: oci-rust
          shared-key: build
          cache-on-failure: true

      - name: Fetch Firecracker and the Guest Kernel
        run: make oci.tools

      - name: Build the Runtime, guestfn, the Init and the Fixture
        run: |
          cargo build --locked --release -p function-wasm --no-default-features --features oci
          cargo build --locked --release -p guestfn
          cargo build --locked --release -p guestfn-init --target x86_64-unknown-linux-musl

      - name: Build the End-to-End Guest as a Process
        run: make e2e.oci.guest

      - name: Collect the Tools
        run: |
          mkdir -p "${RUNNER_TEMP}/oci-tools"
          cp target/release/function target/release/guestfn "${RUNNER_TEMP}/oci-tools/"
          cp target/x86_64-unknown-linux-musl/release/guestfn-init "${RUNNER_TEMP}/oci-tools/init"
          cp target/x86_64-unknown-linux-musl/release/guestfn-guest-fixture "${RUNNER_TEMP}/oci-tools/fixture"
          cp .cache/tools/oci/firecracker .cache/tools/oci/vmlinux "${RUNNER_TEMP}/oci-tools/"
          cp crates/e2e/guest/target/x86_64-unknown-linux-musl/release/e2e-guest-oci "${RUNNER_TEMP}/oci-tools/"

      - name: Upload the Tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-tools
          path: ${{ runner.temp }}/oci-tools
          retention-days: 1

  # The engine's own suite over Firecracker: the process contract's clauses
  # with the fixture process, under KVM.
  engine-tests:
    name: engine (firecracker)
    runs-on: ubuntu-26.04
    needs: build-oci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: oci-rust
          shared-key: tests
          cache-on-failure: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the Tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-tools
          path: ${{ runner.temp }}/oci-tools

      - name: Run the Engine Suite in VMs
        env:
          FUNCTION_WASM_REQUIRE_KVM: "1"
        run: |
          chmod +x "${RUNNER_TEMP}/oci-tools/firecracker" "${RUNNER_TEMP}/oci-tools/init" "${RUNNER_TEMP}/oci-tools/fixture"
          export GUESTFN_FIRECRACKER="${RUNNER_TEMP}/oci-tools/firecracker"
          export GUESTFN_KERNEL="${RUNNER_TEMP}/oci-tools/vmlinux"
          export GUESTFN_INIT="${RUNNER_TEMP}/oci-tools/init"
          export GUESTFN_FIXTURE="${RUNNER_TEMP}/oci-tools/fixture"
          cargo test --locked -p function-wasm-engine-oci -p guestfn-init -- --nocapture

  # The oci profile of the end-to-end suite: the function-oci package in
  # kind with /dev/kvm from the runner, driven through the Guest XR with
  # the test module as a process.
  e2e-cluster-oci:
    name: e2e (cluster, oci)
    runs-on: ubuntu-26.04
    needs: build-oci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache the Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: oci-rust
          shared-key: e2e
          cache-on-failure: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download the Tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-tools
          path: ${{ runner.temp }}/oci-tools

      - name: Use the Prebuilt Tools
        run: |
          chmod +x "${RUNNER_TEMP}"/oci-tools/*
          echo "FUNCTION_OCI_TOOLS=${RUNNER_TEMP}/oci-tools" >> "$GITHUB_ENV"
          echo "E2E_OCI_GUEST=${RUNNER_TEMP}/oci-tools/e2e-guest-oci" >> "$GITHUB_ENV"

      - name: Bring the Cluster Up
        run: make e2e.oci.up

      - name: Run the OCI Profile
        run: make e2e.test.oci

      - name: Dump the Cluster
        if: failure()
        run: make e2e.dump

      - name: Upload the Dump
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-oci-cluster-dump
          path: |
            _output/controlplane-dump
            _output/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the Cluster Down
        if: always()
        run: make e2e.down
