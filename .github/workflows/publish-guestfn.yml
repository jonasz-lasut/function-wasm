name: Publish guestfn

# The guestfn CLI's release binaries for Linux and macOS, amd64 and arm64,
# with a SHA256SUMS file, signed and attested like the packages and the
# examples (#284). Run by hand from the guestfn-<version> tag once its GitHub
# release exists (/cut-release): it refuses any other ref and attaches the
# binaries to that release. The Linux binaries are static, so they run on
# any distribution.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish (e.g. v0.1.0), run from the guestfn-<version> tag"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-26.04, os: linux, arch: amd64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-26.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, os: darwin, arch: amd64, target: x86_64-apple-darwin }
          - { runner: macos-15, os: darwin, arch: arm64, target: aarch64-apple-darwin }
    env:
      TARGET: ${{ matrix.target }}
      BINARY: guestfn-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Refuse Another Ref
        run: |
          if [ "${GITHUB_REF}" != "refs/tags/guestfn-${VERSION}" ]; then
            echo "::error::run this from the tag guestfn-${VERSION}, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # aws-lc's C half builds with musl-gcc for a static binary.
      - name: Install the musl Toolchain
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build guestfn
        env:
          GUESTFN_CLI_VERSION: ${{ inputs.version }}
        run: cargo build --locked --release -p guestfn --target "${TARGET}"

      - name: Name the Binary
        run: |
          mkdir dist
          cp "target/${TARGET}/release/guestfn" "dist/${BINARY}"

      - name: Upload the Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BINARY }}
          path: dist/${{ env.BINARY }}
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guestfn-*
          merge-multiple: true
          path: dist

      - name: Write the Checksums
        working-directory: dist
        run: sha256sum guestfn-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the Checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest SLSA Provenance to the Binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/guestfn-*
          create-storage-record: false

      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "guestfn-${VERSION}" dist/* --repo "${GITHUB_REPOSITORY}"
