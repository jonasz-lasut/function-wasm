# The use-case examples' own publish (#245): run by hand, from main, when an
# example's guestfn.yaml version moved. The examples version independently
# of the runtime, so a release neither builds nor carries them; the package
# publishes through publish-function.yml alone. A keyless signature from this
# workflow names publish-examples.yml on refs/heads/main as its identity,
# which the operator's trustSigner rule states (docs/operators/signatures.md).
name: Publish Examples

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  # guestfn, built once for the example jobs below.
  build-guestfn:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # A published version is never published again, so one built from
      # another branch would stay: the examples are main's.
      - name: Refuse Another Ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::run this from main, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build guestfn
        run: cargo build --locked --release -p guestfn

      - name: Upload guestfn
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guestfn
          path: target/release/guestfn
          if-no-files-found: error
          retention-days: 1

  # The use-case examples (#112) as CNCF Wasm OCI artifacts with their module
  # manifests, at ghcr.io/jonasz-lasut/guestfn/examples/<runtime>-<lang>:v<version>
  # (the directory's name less its function- prefix: function-wasm-rust
  # publishes as wasm-rust),
  # signed and attested like the image. Each example carries its own version
  # in its guestfn.yaml, independent of the runtime's: a version already
  # published is never pushed again, so a run publishes only the examples
  # whose version moved, and a published tag stays immutable. Only the
  # examples that work as published are here: function-wasm-python and function-wasm-csharp
  # request egress to placeholder hosts their users replace before
  # publishing their own. function-oci-go is an oci@0.1 module: buildx pushes
  # its image for amd64 and arm64 into the repository first, by digest and
  # under no tag, and guestfn push --image publishes the module, the image
  # with its manifest layer, under the version tag - the repository's one
  # tag per version.
  publish-examples:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs:
      - build-guestfn
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: function-wasm-rust
            repository: wasm-rust
            toolchain: rust
          - name: function-wasm-ts
            repository: wasm-ts
            toolchain: node
          - name: function-wasm-go
            repository: wasm-go
            toolchain: go
          - name: function-oci-go
            repository: oci-go
            toolchain: docker
    env:
      REPOSITORY: jonasz-lasut/guestfn/examples/${{ matrix.repository }}
      EXAMPLE: examples/${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Example Version
        id: example
        run: |
          version=$(sed -nE 's/^version: *([^ #]+).*$/\1/p' "${EXAMPLE}/guestfn.yaml")
          if [ -z "${version}" ]; then
            echo "::error::${EXAMPLE}/guestfn.yaml declares no version"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # 200: published already, so the digest is read from the registry
      # rather than pushed again; 404: not yet (also for a repository that does
      # not exist yet); anything else stops the job rather than risk pushing
      # over a published tag.
      - name: Skip a Published Version
        id: registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.example.outputs.tag }}
        run: |
          token=$(curl -sSf -u "${GITHUB_REPOSITORY_OWNER}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" | jq -r .token)
          status=$(curl -s -I -o "${RUNNER_TEMP}/manifest-headers" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${REPOSITORY}/manifests/${TAG}")
          case "${status}" in
            200)
              digest=$(tr -d '\r' < "${RUNNER_TEMP}/manifest-headers" | sed -nE 's/^docker-content-digest: (sha256:[0-9a-f]{64})$/\1/Ip')
              if [ -z "${digest}" ]; then
                echo "::error::ghcr.io/${REPOSITORY}:${TAG} answered without a digest"
                exit 1
              fi
              echo "::notice::ghcr.io/${REPOSITORY}:${TAG} is already published; leaving it as it is"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::cannot tell whether ghcr.io/${REPOSITORY}:${TAG} exists (HTTP ${status})"
              exit 1
              ;;
          esac

      - name: Download guestfn
        if: steps.registry.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guestfn
          path: ${{ runner.temp }}/guestfn

      # function-wasm-go's Makefile builds through guestfn; the push below uses it too.
      - name: Use the Prebuilt guestfn
        if: steps.registry.outputs.publish == 'true'
        run: |
          chmod +x "${RUNNER_TEMP}/guestfn/guestfn"
          echo "GUESTFN=${RUNNER_TEMP}/guestfn/guestfn" >> "$GITHUB_ENV"

      # function-wasm-rust's rust-toolchain.toml brings its own toolchain and
      # target; prost-build needs protoc.
      - name: Setup Rust
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'rust'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup protoc
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'rust'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=protocolbuffers/protobuf versioning=regex:^(?<major>\d+)\.(?<minor>\d+)$ extractVersion=^v(?<version>.+)$
          version: '35.1'

      - name: Setup Node
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Setup Go
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: ${{ env.EXAMPLE }}/go.mod

      - name: Build the Example
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain != 'docker'
        run: make -C "${EXAMPLE}" build

      - name: Install Cosign
        if: steps.registry.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GHCR
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'docker'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image goes into the module's repository first, by digest and
      # under no tag (the version tag is the module's alone), for both
      # platforms the runtime serves (the Go build stage cross-compiles, so
      # no emulation); guestfn push --image below reads it back by that
      # digest. Provenance and SBOM attestations are off: they add manifests
      # of no platform to the index.
      - name: Push the Image
        id: image
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'docker'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --output "type=image,name=ghcr.io/${REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/image.json" "${EXAMPLE}"
          digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/image.json")
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::docker buildx build reported no digest"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # guestfn push refuses a module the runtime would refuse, publishes the
      # module manifest as the artifact's second layer, and is reproducible
      # under SOURCE_DATE_EPOCH.
      - name: Push the Example
        id: push
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain != 'docker'
        env:
          TAG: ${{ steps.example.outputs.tag }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          output=$("${GUESTFN}" push --file "${EXAMPLE}/fn.wasm" --manifest "${EXAMPLE}/guestfn.yaml" \
            --revision "${GITHUB_SHA}" "ghcr.io/${REPOSITORY}:${TAG}")
          echo "${output}"
          digest=$(printf '%s\n' "${output}" | sed -nE 's/^Pushed .*@(sha256:[0-9a-f]{64})$/\1/p')
          if [ -z "${digest}" ]; then
            echo "::error::guestfn push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # guestfn push --image appends the manifest to the image as one more
      # layer and publishes the result, which Docker still runs, under the
      # version tag; the Composition pins the digest it prints.
      - name: Push the Example Image
        id: push-image
        if: steps.registry.outputs.publish == 'true' && matrix.toolchain == 'docker'
        env:
          TAG: ${{ steps.example.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          output=$("${GUESTFN}" push --manifest "${EXAMPLE}/guestfn.yaml" \
            "ghcr.io/${REPOSITORY}:${TAG}" --image "ghcr.io/${REPOSITORY}@${IMAGE_DIGEST}")
          echo "${output}"
          digest=$(printf '%s\n' "${output}" | sed -nE 's/^Pushed [^ ]*@(sha256:[0-9a-f]{64}).*$/\1/p')
          if [ -z "${digest}" ]; then
            echo "::error::guestfn push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the Example
        if: steps.registry.outputs.publish == 'true'
        run: cosign sign --yes "ghcr.io/${REPOSITORY}@${{ steps.push.outputs.digest || steps.push-image.outputs.digest }}"

      - name: Attest SLSA Provenance to the Example
        if: steps.registry.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest || steps.push-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
