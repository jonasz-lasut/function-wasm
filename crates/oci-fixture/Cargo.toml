[package]
name = "guestfn-guest-fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The function the OCI engine's VM tests run: an ordinary function on function-sdk-rust, built static for musl"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
function-sdk-rust = "0.4.0"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
