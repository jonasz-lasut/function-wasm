[package]
name = "guestfn-engine-oci"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The OCI engine of function-oci, behind guestfn-engine's Engine trait: one Firecracker microVM per request"
publish = false

[dependencies]
# The root filesystem is a squashfs, kept read-only on the VM's block
# device under a tmpfs overlay, its blocks packed with zstd: the guest
# reads them faster than gzip's (docs/one-pager-oci-runtime.md, "The
# packing of the root filesystem"). backhand's zstd is the zstd crate over zstd-sys,
# the C library built with `cc`, in function-oci alone: function-wasm
# depends on no part of this crate. The layers and the image layout are
# tar, a gzip layer unpacked by flate2 (zlib-rs).
backhand = { version = "0.25.5", default-features = false, features = ["zstd"] }
flate2 = "1"
guestfn-engine = { path = "../engine" }
guestfn-oci-protocol = { path = "../oci-protocol" }
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tracing.workspace = true

# The call to the function's gRPC server over vsock.
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
tonic = "0.14"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
function-sdk-rust = "0.4.0"
# The crate's own tests use its testing module.
guestfn-engine-oci = { path = ".", features = ["testutil"] }
prost = "0.14"

[features]
# The testing module: the image fixtures and the fake sandbox.
testutil = []
# The hand-run benchmark (tests/bench.rs): the marks of a run's timeline,
# and the squashfs compressors it compares with the one the engine writes.
# No function is built with it.
bench = ["backhand/gzip", "backhand/lz4"]

[[test]]
name = "bench"
required-features = ["bench"]
