# wasm32-wasip3 is a stable target since Rust 1.100.0. This file names the
# stable toolchain with the target and the components this guest needs:
# rustup adds them the first time cargo runs here. A stable toolchain older
# than 1.100.0 needs `rustup update stable` first.
[toolchain]
channel = "stable"
targets = ["wasm32-wasip3"]
components = ["rustfmt", "clippy"]
profile = "minimal"
