[package]
name = "guestfn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
function-wasm = { path = "../function" }
function-wasm-engine = { path = "../engine" }
hex = "0.4"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"

[dev-dependencies]
function-wasm = { path = "../function", features = ["testutil"] }
tempfile = "3"
wat = "1"
