[package]
name = "guestfn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# The manifest layer guestfn push appends to an OCI image: a gzip tar.
flate2 = "1"
guestfn-runtime = { path = "../function" }
guestfn-engine = { path = "../engine" }
guestfn-engine-wasm = { path = "../engine-wasm" }
hex = "0.4"
include_dir = "0.7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.11"
tar = "0.4"

[dev-dependencies]
guestfn-runtime = { path = "../function", features = ["testutil"] }
tempfile = "3"
wat = "1"
