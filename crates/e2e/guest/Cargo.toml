[package]
name = "e2e-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "guestfn's end-to-end test module: an ABI v2 guest whose composite resource's spec says which runtime feature to exercise, composing provider-nop resources"

# Its own workspace root: a package under a member's directory (crates/e2e)
# cannot be excluded from the root workspace, and this one is a standalone
# wasm32-wasip3 guest on the rust scaffold's pinned toolchain.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# The same module as an OCI image's process (src/main.rs, the oci profile):
# built natively for musl under the `process` feature, so the wasm build
# never sees it.
[[bin]]
name = "e2e-guest-oci"
path = "src/main.rs"
required-features = ["process"]

[features]
process = ["dep:clap", "dep:function-sdk-rust", "dep:pollster", "dep:tokio", "dep:tonic"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = { version = "1", optional = true }
# The module as a process is an ordinary function on the SDK.
clap = { version = "4", optional = true, features = ["derive", "env"] }
function-sdk-rust = { version = "0.4.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", optional = true }

# The component bindings (src/bindings.rs) exist only in the wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
pollster = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
