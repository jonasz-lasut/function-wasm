# The oci profile's variant: the same declaration around the test module as
# a process (docs/one-pager-oci-runtime.md); guestfn push --image pins the
# image, which setup does by hand.
# The test module under the default sandbox: it requires nothing, so it runs
# under any policy, and it is the module every signature case is pushed as.
contract: oci@1.0
name: e2e-guest
version: 0.1.0
description: guestfn's end-to-end test module, requiring nothing
# What the requirements knob asks Crossplane for - advisory, for the tooling,
# and no grant: the runtime judges the actual selector against the policy
# layers' requireResource rules after the run.
requires:
  resources:
    - kind: apiextensions.crossplane.io/EnvironmentConfig
      by: [name]
