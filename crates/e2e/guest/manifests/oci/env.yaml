# The oci profile's variant: the same declaration around the test module as
# a process (docs/one-pager-oci-runtime.md); guestfn push --image pins the
# image, which setup does by hand.
# The test module requiring one environment variable bound to a key of the
# step credential e2e.
contract: oci@1.0
name: e2e-guest
version: 0.1.0-env
description: function-wasm's end-to-end test module, requiring an env binding
requires:
  env:
  - name: E2E_TOKEN
    fromCredential:
      name: e2e
      key: token
