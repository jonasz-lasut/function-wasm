# The oci profile's variant: the same declaration around the test module as
# a process (docs/one-pager-oci-runtime.md); guestfn push --image pins the
# image, which setup does by hand.
# The test module requiring the step credential e2e whole: the request it
# receives carries that credential and no other.
contract: oci@0.1
name: e2e-guest
version: 0.1.0-credentials
description: guestfn's end-to-end test module, requiring a step credential
requires:
  credentials: [e2e]
