# The test module requiring one environment variable bound to a key of the
# step credential e2e.
contract: wasm@1.0
name: e2e-guest
version: 0.1.0-env
description: guestfn's end-to-end test module, requiring an env binding
requires:
  env:
  - name: E2E_TOKEN
    fromCredential:
      name: e2e
      key: token
