# The test module requiring egress to the suite's registry: GET /v2/ on the
# in-cluster registry host, the target of every egress case.
abi: 2
name: e2e-guest
version: 0.1.0-egress
description: function-wasm's end-to-end test module, requiring egress to the suite's registry
requires:
  egress:
    http:
    - host: registry.e2e.svc
      methods: [GET]
      pathPrefix: /v2/
