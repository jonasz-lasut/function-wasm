# The lifecycle profile: --debug, the published function-wasm-go warmed at
# startup (a 77 MiB module: a visible warm-up and a cache entry the sweep has
# to remove), the caches on a volume that outlives the pod, bounded below
# that module's size so the startup sweep has work, and the trusted root
# fetched over TUF from the public-good instance (no root file mounted),
# which the policy's trustSigner rule holds the warmed module's keyless
# signature to; the TUF cache shares the volume.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: e2e-wasm-lifecycle
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          containers:
          - name: package-runtime
            image: function-wasm-e2e:dev
            args:
            - --debug
            - --sandbox-policy-file=/etc/guestfn/policy/policy.cedar
            - --cosign-trust-instance=public-good
            - --warm-modules=ghcr.io/jonasz-lasut/guestfn/examples/wasm-go@sha256:253aadf6a20a3fa8c487fa57e1f0133d39e66093ee4b25ba4433a00247e1c159
            # In MiB: below the warmed module's 77 MiB, so the startup sweep
            # (which runs before the warm-up) has to remove it.
            - --max-cache-size=64
            env:
            - name: SSL_CERT_FILE
              value: /etc/guestfn/registry-ca/ca.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            # Ready means warmed: /readyz answers 503 until every warm-up
            # entry is loaded (docs/operators/readiness.md).
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8081
              periodSeconds: 2
            volumeMounts:
            - name: policy
              mountPath: /etc/guestfn/policy
              readOnly: true
            - name: cache
              mountPath: /tmp/guestfn-cache
            - name: registry-ca
              mountPath: /etc/guestfn/registry-ca
              readOnly: true
          volumes:
          - name: policy
            configMap:
              name: e2e-policy-wasm-lifecycle
          - name: cache
            persistentVolumeClaim:
              claimName: e2e-cache
          - name: registry-ca
            configMap:
              name: e2e-registry-ca
