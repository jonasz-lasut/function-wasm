# The default profile: both verifiers (the suite's cosign key and the merged
# trusted root), the default policy, and the registry CA trusted beside the
# image's bundle (SSL_CERT_FILE replaces the platform store for rustls, so
# SSL_CERT_DIR names the image's bundle again).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: e2e-wasm-default
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          containers:
          - name: package-runtime
            image: function-wasm-e2e:dev
            args:
            - --sandbox-policy-file=/etc/guestfn/policy/policy.cedar
            - --cosign-key=/etc/guestfn/cosign/cosign.pub
            - --cosign-trusted-root=/etc/guestfn/trusted-root/trusted_root.json
            env:
            - name: SSL_CERT_FILE
              value: /etc/guestfn/registry-ca/ca.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            volumeMounts:
            - name: policy
              mountPath: /etc/guestfn/policy
              readOnly: true
            - name: cosign-key
              mountPath: /etc/guestfn/cosign
              readOnly: true
            - name: trusted-root
              mountPath: /etc/guestfn/trusted-root
              readOnly: true
            - name: registry-ca
              mountPath: /etc/guestfn/registry-ca
              readOnly: true
          volumes:
          - name: policy
            configMap:
              name: e2e-policy-wasm-default
          - name: cosign-key
            secret:
              secretName: e2e-cosign-key
          - name: trusted-root
            configMap:
              name: e2e-trusted-root
          - name: registry-ca
            configMap:
              name: e2e-registry-ca
