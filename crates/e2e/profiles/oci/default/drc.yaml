# The oci profile: the function-oci package (docs/one-pager-oci-runtime.md)
# with /dev/kvm granted by the node's device plugin (kvm-device-plugin.yaml
# beside this file: the pod requests one devic.es/kvm) and opened through
# the node's kvm group, whose gid the e2e setup reads from the node and
# patches in as the pod's supplementalGroups, as the operator page
# documents; the default profile's policy and verifiers; and the registry
# CA trusted beside the image's bundle. A separate Function (function-oci)
# runs under it, beside function-wasm; the suite composes with one or the
# other by profile.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: e2e-oci-default
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          containers:
          - name: package-runtime
            image: function-oci-e2e:dev
            args:
            - --sandbox-policy-file=/etc/guestfn/policy/policy.cedar
            - --cosign-key=/etc/guestfn/cosign/cosign.pub
            - --cosign-trusted-root=/etc/guestfn/trusted-root/trusted_root.json
            - --debug
            resources:
              limits:
                devic.es/kvm: "1"
            env:
            - name: SSL_CERT_FILE
              value: /etc/guestfn/registry-ca/ca.crt
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            volumeMounts:
            - name: policy
              mountPath: /etc/guestfn/policy
              readOnly: true
            - name: cosign-key
              mountPath: /etc/guestfn/cosign
              readOnly: true
            - name: trusted-root
              mountPath: /etc/guestfn/trusted-root
              readOnly: true
            - name: registry-ca
              mountPath: /etc/guestfn/registry-ca
              readOnly: true
          volumes:
          - name: policy
            configMap:
              name: e2e-policy-wasm-default
          - name: cosign-key
            secret:
              secretName: e2e-cosign-key
          - name: trusted-root
            configMap:
              name: e2e-trusted-root
          - name: registry-ca
            configMap:
              name: e2e-registry-ca
