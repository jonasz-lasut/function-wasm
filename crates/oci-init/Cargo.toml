[package]
name = "guestfn-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The guest init of function-oci: PID 1 of the microVM, built static for musl"
publish = false

# Nothing beyond the protocol and libc: this is the one binary of the
# workspace that runs inside the VM, packed into every initramfs.
[dependencies]
guestfn-oci-protocol = { path = "../oci-protocol" }
libc = "0.2"
serde_json.workspace = true
