[package]
name = "guestfn-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The guest init of function-oci: PID 1 of the microVM, built static for musl"
publish = false

# Nothing beyond the protocol and libc: this is the one binary of the
# workspace that runs inside the VM, packed into every initramfs.
[dependencies]
guestfn-oci-protocol = { path = "../oci-protocol" }
libc = "0.2"
serde_json.workspace = true

# TEMPORARY, latency experiments that are not for merge: exp-fast-poll
# shortens the init's polling waits, exp-trace prints where the init's own
# time went on the serial console before it reports the exit.
[features]
exp-fast-poll = []
exp-trace = []
