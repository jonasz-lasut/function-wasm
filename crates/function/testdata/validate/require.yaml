# The read fence (requireResource): the first step's compositionPolicy
# scopes it (the function-wasm-ts rule: the module may read the EnvironmentConfig
# its XR names and nothing else), so validate marks the step; the second
# scopes nothing. Only a run can judge a module's resource selectors, so both
# steps are admitted.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: require
spec:
  pipeline:
  - step: fenced
    functionRef:
      name: function-wasm
    input:
      apiVersion: guestfn.crossplane.io/v1
      kind: Input
      module:
        type: Path
        path: fn.wasm
      compositionPolicy: |
        permit (principal, action == Action::"requireResource", resource == Kind::"apiextensions.crossplane.io/EnvironmentConfig")
        when { context has name };
  - step: unfenced
    functionRef:
      name: function-wasm
    input:
      apiVersion: guestfn.crossplane.io/v1
      kind: Input
      module:
        type: Path
        path: fn.wasm
      compositionPolicy: |
        permit (principal, action == Action::"usePrivateTmp", resource);
