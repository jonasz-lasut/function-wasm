apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: hello
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XR
  mode: Pipeline
  pipeline:
  - step: hello
    functionRef:
      name: function-wasm
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: Path
        path: fn.wasm
      limits:
        timeout: 5s
        memory: 128Mi
      config:
        greeting: hi
