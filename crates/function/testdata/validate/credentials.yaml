# A module whose manifest (credentials.wasmfn.yaml, copied beside fn.wasm in
# the --module-dir) requires the step credential cmdb whole. Each step puts
# it under a different composition layer: none, one permitting cmdb, and one
# scoping spendCredential to another credential.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: credentials
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XR
  mode: Pipeline
  pipeline:
  - step: unfenced
    functionRef:
      name: function-wasm
    credentials:
    - name: cmdb
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: cmdb-tokens
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: Path
        path: fn.wasm
        manifestPath: credentials.wasmfn.yaml
  - step: permitted
    functionRef:
      name: function-wasm
    credentials:
    - name: cmdb
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: cmdb-tokens
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: Path
        path: fn.wasm
        manifestPath: credentials.wasmfn.yaml
      compositionPolicy: |
        permit (principal, action == Action::"spendCredential", resource == Credential::"cmdb");
  - step: fenced
    functionRef:
      name: function-wasm
    credentials:
    - name: cmdb
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: cmdb-tokens
    input:
      apiVersion: wasm.fn.crossplane.io/v1beta1
      kind: Input
      module:
        type: Path
        path: fn.wasm
        manifestPath: credentials.wasmfn.yaml
      compositionPolicy: |
        permit (principal, action == Action::"spendCredential", resource == Credential::"registry");
