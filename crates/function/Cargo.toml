[package]
name = "function-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Crossplane composition function that runs WebAssembly modules (Rust runtime)"
publish = false

[[bin]]
name = "function"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
bytes = "1"
flate2 = "1"
cedar-policy = "4"
clap = { version = "4", features = ["derive", "env"] }
function-sdk-rust = "0.4.0"
function-wasm-engine = { path = "../engine" }
hex = "0.4"
http = "1"
http-body = "1"
jsonschema = "0.60"
tempfile = "3"
pbjson-types = "0.9"
prost = "0.14"
# query and json: the registry client's token request and response; the
# sigstore 0.14 crate used to enable them transitively.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "query", "json"] }
serde.workspace = true
serde_json.workspace = true
pem = "4"
# Signs Sigstore bundles in cosign::testutil (feature testutil) only.
p256 = { version = "0.14", features = ["ecdsa", "pem"], optional = true }
serde_yaml = "0.9"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
tower-layer = "0.3"
tower-service = "0.3"
tracing.workspace = true
# env-filter: the --debug filter in logging.rs is scoped by crate; json: the
# pod's line format (the feature function-sdk-rust already enables).
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sigstore-verify = { version = "0.15.1", default-features = false, features = ["aws-lc-rs"] }
sigstore-trust-root = { version = "0.15.1", default-features = false, features = ["aws-lc-rs"] }
sigstore-types = "0.15.1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"], optional = true }
x509-cert = { version = "0.2", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

[dev-dependencies]
# The crate's own integration tests use the test registry.
function-wasm = { path = ".", features = ["testutil"] }
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-cert = "0.2"
tempfile = "3"
wat = "1"
time = { version = "0.3", features = ["formatting"] }

[features]
# rcgen and x509-cert: cosign::testutil::sigstore, the in-memory Sigstore
# instance (Fulcio CA, CT log, Rekor) the keyless tests sign against.
testutil = ["dep:p256", "dep:rcgen", "dep:x509-cert", "dep:time"]
