[package]
name = "guestfn-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The runtime behind the function-wasm and function-oci packages, generic over the engine: the Input admission, the module resolver and caches, the manifest, the policy layers, the raw gRPC service and the offline validator"
publish = false

[dependencies]
base64 = "0.23"
bytes = "1"
flate2 = "1"
cedar-policy = "4"
clap = { version = "4", features = ["derive", "env"] }
function-sdk-rust = "0.4.0"
# The trait the runtime is generic over; the binaries supply the engine
# (crates/function-wasm, crates/function-oci). The Wasmtime engine is here
# for the testing module alone (feature testutil).
guestfn-engine = { path = "../engine" }
guestfn-engine-wasm = { path = "../engine-wasm", features = ["testutil"], optional = true }
# getrandom draws the compiled store's per-process key, hmac signs each
# artifact under it (store.rs).
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
# default-features off: the crate's defaults resolve a $ref over http and the
# filesystem, which a module's config.schema must never do (the 1.0 audit's
# F-3); idna stays for the idn-hostname format.
jsonschema = { version = "0.61", default-features = false, features = ["idna"] }
tempfile = "3"
pbjson-types = "0.9"
prost = "0.14"
# The descriptor types, to read the schema the SDK embeds (partial.rs);
# tonic-reflection already links them.
prost-types = "0.14"
# query and json: the registry client's token request and response; the
# sigstore 0.14 crate used to enable them transitively.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "query", "json"] }
serde.workspace = true
serde_json.workspace = true
# The Input's JSON Schema, from which crd.rs generates the CRD under
# package/wasm/input/ (the doc comments are the descriptions).
schemars = "1"
pem = "4"
# Signs Sigstore bundles in cosign::testutil (feature testutil) only.
p256 = { version = "0.14", features = ["ecdsa", "pem"], optional = true }
# serde-saphyr: YAML in pure Rust (the saphyr parser), maintained; its scalar
# resolution and error wording differ from libyaml's, which the manifest page
# and the Unparsable golden state.
serde-saphyr = "2"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
tower-layer = "0.3"
tower-service = "0.3"
tracing.workspace = true
# env-filter: the --debug filter in logging.rs is scoped by crate; json: the
# pod's line format (the feature function-sdk-rust already enables).
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sigstore-verify = { version = "0.16.0", default-features = false, features = ["aws-lc-rs"] }
# tuf and rustls: the trusted root fetched over TUF (--cosign-trust-instance,
# trustroot.rs) - the instances' embedded TUF roots and the TUF client
# below, over reqwest with rustls like the registry client.
sigstore-trust-root = { version = "0.16.0", default-features = false, features = ["aws-lc-rs", "tuf", "rustls"] }
sigstore-tuf = { version = "0.16.0", default-features = false, features = ["client", "aws-lc-rs"] }
# The TUF client takes the time it validates metadata at as a jiff timestamp.
jiff = "0.2"
sigstore-types = "0.16.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"], optional = true }
x509-cert = { version = "0.3", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

[dev-dependencies]
# The crate's own integration tests use the test registry.
guestfn-engine-wasm = { path = "../engine-wasm", features = ["testutil"] }
guestfn-runtime = { path = ".", features = ["testutil"] }
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-cert = "0.3"
tempfile = "3"
# A paused clock, for the listeners' read timeout.
tokio = { version = "1", features = ["test-util"] }
wat = "1"
time = { version = "0.3", features = ["formatting"] }

[features]
# The testing module (the in-memory registry, the signers, the runtime
# builder, the greeting server, the open policy) and what it stands on:
# rcgen and x509-cert for testsigstore, the in-memory Sigstore instance
# (Fulcio CA, CT log, Rekor) the keyless tests sign against, and the
# engine's WAT fixtures.
testutil = ["dep:p256", "dep:rcgen", "dep:x509-cert", "dep:time", "dep:guestfn-engine-wasm"]
