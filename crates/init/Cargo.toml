[package]
name = "guestfn-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The OCI runtime's guest init: PID 1 of the microVM, which mounts the image's root filesystem, runs the image's process under the process contract and relays its streams to the host over vsock; and the protocol the host speaks to it"
publish = false

# The binaries are built for a musl target (static: an initramfs has no
# libc, and the init must depend on nothing in the image), by the Makefile's
# oci targets and Dockerfile.oci; the library (the protocol) is what
# function-wasm-engine-oci links.
[[bin]]
name = "guestfn-init"
path = "src/main.rs"

# The process the OCI engine's tests run in a VM: a static binary whose
# first argument says how to misbehave.
[[bin]]
name = "guestfn-guest-fixture"
path = "src/bin/fixture.rs"

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
