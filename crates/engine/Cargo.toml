[package]
name = "function-wasm-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The wasmtime engine of function-wasm: compiles and runs ABI v1 and v2 guest modules"
publish = false

[dependencies]
base64 = "0.23"
bytes = "1"
http = "1"
http-body-util = "0.1"
prometheus-client = "0.25.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror = "2"
tracing.workspace = true
wasmtime = { version = "49.0.2", features = ["call-hook"] }
wasmtime-wasi = { version = "49.0.2", features = ["p3"] }
# default-send-request stays off on purpose: the compiler then requires the
# egress hooks implementation - a run can never fall through to an
# unpoliced default HTTP client.
wasmtime-wasi-http = { version = "49.0.2", default-features = false, features = ["p2", "p3"] }
# guestfn build's componentizing (componentize.rs) moves with wasmtime: the
# wasip1 adapter is built in the wasmtime repository and published at its
# version, so the adapter linked into a guest is always the one the
# wasmtime-wasi that serves it was released with; wit-component and wasmparser
# are the versions wasmtime's own bindgen already pulls, so no second copy is
# compiled. Renovate moves the adapter with the wasmtime group and ignores the
# other two: bump them by hand in that PR to what `cargo tree -i wit-component`
# shows wasmtime pulling.
wasi-preview1-component-adapter-provider = "49.0.2"
wasmparser = { version = "0.258.3", default-features = false }
wit-component = "0.258.3"

[dev-dependencies]
function-sdk-rust = "0.3.0"
prost = "0.14"
wat = "1"
# The componentize tests embed the runtime's own world into a core module the
# way wit-bindgen does.
wit-parser = "0.258.3"
