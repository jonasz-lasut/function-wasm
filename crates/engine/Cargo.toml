[package]
name = "guestfn-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The engines of guestfn behind one Engine trait: the Wasmtime engine (feature wasm) and the OCI engine (feature oci), with the OCI runtime's guest init and its test fixture as the crate's binaries"
publish = false

# The two binaries are the OCI runtime's guest init (PID 1 of the microVM)
# and the fixture process its VM tests run, built static for musl with no
# feature on (make oci.init, Dockerfile.oci). The init needs the protocol
# module and libc alone. The fixture is an ordinary function on
# function-sdk-rust, behind its own feature so nothing else builds the SDK's
# server.
[[bin]]
name = "guestfn-init"
path = "src/bin/guestfn-init.rs"

[[bin]]
name = "guestfn-guest-fixture"
path = "src/bin/guestfn-guest-fixture.rs"
required-features = ["fixture"]

# The suites of each engine, under its feature.
[[test]]
name = "engine"
required-features = ["wasm"]

[[test]]
name = "componentize"
required-features = ["wasm"]

[[test]]
name = "committed_guest"
required-features = ["wasm"]

[[test]]
name = "pooling_bench"
required-features = ["wasm"]

[[test]]
name = "vm"
required-features = ["oci"]

[dependencies]
# Always: the trait and what every engine shares, and the init's protocol.
libc = "0.2"
prometheus-client = "0.25.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror = "2"
tracing.workspace = true

# The OCI engine (feature oci): the root filesystem is a squashfs written
# in pure Rust (gzip through zlib-rs, so no C), kept read-only on the VM's
# block device under a tmpfs overlay; the layers and the image layout are
# tar.
backhand = { version = "0.25.5", default-features = false, features = ["gzip"], optional = true }
flate2 = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", optional = true }

# The OCI engine's call to the function's gRPC server over vsock, and the
# fixture's server.
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
tonic = { version = "0.14", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
# The VM test fixture: a function on the SDK, with its own arguments.
clap = { version = "4", optional = true, features = ["derive", "env"] }
function-sdk-rust = { version = "0.4.0", optional = true }

# The Wasmtime engine (feature wasm).
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# wasmtime's default features less cache (the runtime keeps its own
# compiled-artifact cache and never sets Config::cache, and the feature pulls
# zstd into the binary), threads and the gc set (the proposals the engine
# refuses, compiled out where the crate lets them be; see the Config in
# lib.rs). A wasmtime bump that adds a default feature is checked by hand
# against this list.
wasmtime = { version = "50.0.1", default-features = false, optional = true, features = [
    "addr2line",
    "anyhow",
    "async",
    "backtrace",
    "call-hook",
    "compile-time-builtins",
    "component-model",
    "component-model-async",
    "coredump",
    "cranelift",
    "debug",
    "debug-builtins",
    "demangle",
    "parallel-compilation",
    "pooling-allocator",
    "profiling",
    "runtime",
    "stack-switching",
    "std",
    "wat",
    "wit-parser",
] }
# p1 stays off: the runtime serves components only (WASI 0.2 and 0.3), so
# the preview1 host and its wiggle dependency are not built.
wasmtime-wasi = { version = "50.0.1", default-features = false, optional = true, features = ["p2", "p3"] }
# default-send-request stays off on purpose: the compiler then requires the
# egress hooks implementation - a run can never fall through to an
# unpoliced default HTTP client.
wasmtime-wasi-http = { version = "50.0.1", default-features = false, optional = true, features = ["p2", "p3"] }
# guestfn build's componentizing (componentize.rs) moves with wasmtime: the
# wasip1 adapter is built in the wasmtime repository and published at its
# version, so the adapter linked into a guest is always the one the
# wasmtime-wasi that serves it was released with; wit-component, wit-parser
# (the embed of a Go guest's world from its wit/ directory) and wasmparser
# are the versions wasmtime's own bindgen already pulls, so no second copy is
# compiled. Renovate moves the adapter with the wasmtime group and ignores the
# other three: bump them by hand in that PR to what `cargo tree -i wit-component`
# shows wasmtime pulling.
wasi-preview1-component-adapter-provider = { version = "50.0.1", optional = true }
wasmparser = { version = "0.258.3", default-features = false, optional = true }
wit-component = { version = "0.258.3", optional = true }
wit-parser = { version = "0.258.3", optional = true }
# The WAT fixtures of the testing module (feature testutil) are assembled
# with wat.
wat = { version = "1", optional = true }

[dev-dependencies]
function-sdk-rust = "0.4.0"
# The crate's own tests use its testing module.
guestfn-engine = { path = ".", default-features = false, features = ["testutil"] }
prost = "0.14"
# The committed-guest tests build the composite resource a RunFunctionRequest
# carries (function-sdk-rust's Struct is pbjson's, serde-capable).
pbjson-types = "0.9"

[features]
default = ["wasm"]
# The Wasmtime engine: the only code in the workspace that imports wasmtime.
wasm = [
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
    "dep:wasi-preview1-component-adapter-provider",
    "dep:wasmparser",
    "dep:wit-component",
    "dep:wit-parser",
]
# The OCI engine of docs/one-pager-oci-runtime.md.
oci = [
    "dep:backhand",
    "dep:flate2",
    "dep:hex",
    "dep:http",
    "dep:hyper-util",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tower",
    "raw-codec",
]
# The pass-through gRPC codec, shared by the runtime's server and the OCI
# engine's client.
raw-codec = ["dep:bytes", "dep:tonic"]
# The fixture process the VM tests run, a function on function-sdk-rust.
fixture = ["dep:clap", "dep:function-sdk-rust", "dep:tokio", "dep:tonic"]
# The testing modules: the WAT component fixtures every suite in the
# workspace drives the Wasmtime engine with (docs/project/testing.md), and
# the OCI engine's image fixtures and fake sandbox.
testutil = ["dep:wat"]
