[package]
name = "function-wasm-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The wasmtime engine of function-wasm: compiles and runs ABI v1 guest modules"
publish = false

[dependencies]
prometheus-client = "0.25.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror = "2"
tracing.workspace = true
wasmtime = { version = "48", features = ["call-hook"] }
wasmtime-wasi = "48"

[dev-dependencies]
function-sdk-rust = "0.3.0"
prost = "0.14"
wat = "1"
