[package]
name = "function-wasm-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The wasmtime engine of function-wasm: compiles and runs ABI v1 and v2 guest modules"
publish = false

[dependencies]
base64 = "0.23"
bytes = "1"
http = "1"
http-body-util = "0.1"
prometheus-client = "0.25.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror = "2"
tracing.workspace = true
wasmtime = { version = "48", features = ["call-hook"] }
wasmtime-wasi = { version = "48", features = ["p3"] }
# default-send-request stays off on purpose: the compiler then requires the
# egress hooks implementation - a run can never fall through to an
# unpoliced default HTTP client.
wasmtime-wasi-http = { version = "48", default-features = false, features = ["p3"] }

[dev-dependencies]
function-sdk-rust = "0.3.0"
prost = "0.14"
wat = "1"
