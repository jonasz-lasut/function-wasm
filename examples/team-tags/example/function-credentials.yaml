# The Secret the team-tags step's credential cmdb names, which the render
# passes to the pipeline (crossplane composition render
# --function-credentials): every team's CMDB token, one key per team
# namespace. The tokens are fake: the fixture server does not check them,
# and the module's unit tests assert the header they travel in.
apiVersion: v1
kind: Secret
metadata:
  name: cmdb-tokens
  namespace: crossplane-system
type: Opaque
data:
  payments: bm90LWEtcmVhbC1wYXltZW50cy10b2tlbg== # not-a-real-payments-token
  search: bm90LWEtcmVhbC1zZWFyY2gtdG9rZW4= # not-a-real-search-token
