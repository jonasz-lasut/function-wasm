apiVersion: storage.example.org/v1alpha1
kind: Bucket
metadata:
  name: index
  # The team: the search team's namespace.
  namespace: search
spec:
  # The module's configuration (the step's config.from): the CMDB the
  # fixture server render.sh starts stands in for.
  config:
    cmdbUrl: http://127.0.0.1:9480
  region: us-east-1
  tags:
    environment: production
    # Not the composite resource's to say: the CMDB's owner replaces it.
    owner: mallory@example.com
