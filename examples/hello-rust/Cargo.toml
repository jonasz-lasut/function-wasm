[package]
name = "hello-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "A function-wasm guest: a Crossplane composition function compiled to a wasip1 module with prost"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
