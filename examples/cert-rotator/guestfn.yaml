# The module manifest: what this module declares about itself. guestfn build
# validates it, guestfn push publishes it beside the module as the artifact's
# manifest layer, and the runtime holds it against what the policy layers grant
# before every run - a manifest can refuse a run earlier and say why, never
# make one possible.
contract: 2
name: cert-rotator
version: 0.1.0
description: Keeps a TLS Secret's self-signed certificate fresh, rotating it before it expires
requires:
  # No capability: the module reads and issues certificates in memory, with
  # the host's randomness and clock, and needs no egress, no /tmp and no
  # credential. What it asks Crossplane for through its response's
  # requirements - advisory, for the tooling, and no grant: the runtime
  # judges the actual selector against the policy layers' requireResource
  # rules after every run.
  resources:
    - kind: core/Secret
      by: [name]
# What it composes - advisory as well: the Secret, added or modified, held
# against the layers' composeResource rules after the run.
composes:
  - kind: core/Secret
    changes: [add, modify]
config:
  # The module takes no config: the Secret's name, the names on the
  # certificate and the validity live in the composite resource's spec,
  # which the XRD below example/ defines. The runtime refuses a step that
  # passes any.
  schema:
    type: object
    additionalProperties: false
