# The Secret the module asks Crossplane for, as crossplane render supplies
# it instead of a cluster: shop-tls in team-a, holding a self-signed
# certificate openssl issued for one day. Within the 30 days before its
# end, so the render shows a rotation; once the day has passed, an expired
# one, rotated the same way. In a cluster the module composes this Secret
# itself after the first run, and reads back what it wrote.
apiVersion: v1
kind: Secret
metadata:
  name: shop-tls
  namespace: team-a
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
