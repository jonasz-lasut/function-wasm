# A server certificate a team asks for by name: a self-signed certificate in
# a TLS Secret of the team's namespace, kept fresh by the cert-rotator
# module. Crossplane v2: a namespaced composite resource, no claim.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: servercertificates.pki.example.org
spec:
  group: pki.example.org
  names:
    kind: ServerCertificate
    plural: servercertificates
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              secretName:
                description: >-
                  The TLS Secret, in this namespace, that holds the
                  certificate and its key. Defaults to <name>-tls.
                type: string
              commonName:
                description: >-
                  The certificate's common name, and its first DNS name.
                  Defaults to the composite resource's name.
                type: string
              dnsNames:
                description: Further DNS names the certificate is valid for.
                type: array
                items:
                  type: string
              validityDays:
                description: How long a freshly issued certificate is valid.
                type: integer
                default: 90
                minimum: 1
              renewBeforeDays:
                description: >-
                  How long before it expires a certificate is rotated. Must
                  be less than validityDays.
                type: integer
                default: 30
                minimum: 0
          status:
            type: object
            properties:
              certificate:
                description: The certificate the Secret holds after the last run.
                type: object
                properties:
                  secretName:
                    type: string
                  subject:
                    type: string
                  serialNumber:
                    type: string
                  notBefore:
                    type: string
                  notAfter:
                    type: string
                  daysLeft:
                    type: integer
                  rotated:
                    description: Whether the last run issued a new certificate.
                    type: boolean
                  reason:
                    description: >-
                      Why: valid, absent, expired, expiring, or unreadable
                      with what was wrong.
                    type: string
