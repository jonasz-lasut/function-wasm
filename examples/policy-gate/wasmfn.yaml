# The module manifest: what this module declares about itself. guestfn build
# validates it, guestfn push publishes it beside the module as the artifact's
# manifest layer, and the runtime holds it against what the policy layers grant
# before every run - a manifest can refuse a run earlier and say why, never
# make one possible.
abi: 2
name: policy-gate
version: 0.1.0
# requires: nothing. The gate reads its rules from the EnvironmentConfig
# Crossplane supplies in the request, so it needs no egress, no /tmp and no
# credentials, and renders without any grant; it is built without wasi:http
# (jco componentize -d http), so it could not use an egress grant either.
config:
  # The gate takes no config: its rules live in the EnvironmentConfigs, which
  # the platform team owns, not in the Compositions that run it. The runtime
  # refuses a step that passes any.
  schema:
    type: object
    additionalProperties: false
