# A web application the platform team runs for a tenant team: a Deployment
# and a Service, plus the add-on the team names, if any. Crossplane v2: a
# namespaced composite resource, no claim.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapps.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: WebApp
    plural: webapps
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [image]
            properties:
              image:
                description: The container image the application runs.
                type: string
              replicas:
                description: How many pods run the application.
                type: integer
                minimum: 0
                default: 2
              port:
                description: The port the application serves on.
                type: integer
                minimum: 1
                maximum: 65535
                default: 8080
              addOn:
                description: >-
                  The team's add-on: a function-wasm module that runs after
                  the platform's step and may add to what it composed. Unset,
                  the step runs nothing. It holds the module source in the
                  shape the Composition's module.type reads: an object
                  {ref: <repository>@sha256:<digest>} for OCI, what a
                  cluster's Composition uses, or a file name under the
                  runtime's --module-dir for Path, what a local render uses.
                  function-wasm decodes it strictly and refuses any other
                  shape with a fatal result naming spec.addOn.
                x-kubernetes-preserve-unknown-fields: true
