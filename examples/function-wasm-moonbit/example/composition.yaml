apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: function-wasm-moonbit
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XR
  mode: Pipeline
  pipeline:
  - step: function-wasm-moonbit
    functionRef:
      name: function-wasm
    input:
      apiVersion: guestfn.crossplane.io/v1
      kind: Input
      module:
        # For local rendering the runtime serves this directory (--module-dir).
        # In a cluster use type: OCI and an oci reference pinned to the digest
        # guestfn push prints.
        type: Path
        path: fn.wasm
      config:
        # The module's configuration lives in the composite resource, in the
        # field named here (example/xr.yaml sets spec.config.greeting).
        from: spec.config
