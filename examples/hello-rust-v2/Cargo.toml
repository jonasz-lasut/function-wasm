[package]
name = "hello-rust-v2"
version = "0.1.0"
edition = "2021"
publish = false
description = "A function-wasm ABI v2 guest: a Crossplane composition function compiled to a WebAssembly component, fetching over async wasi:http"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
wit-bindgen = "0.61"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
