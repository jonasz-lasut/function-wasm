apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: origins.network.example.org
spec:
  compositeTypeRef:
    apiVersion: network.example.org/v1alpha1
    kind: Origin
  mode: Pipeline
  pipeline:
  - step: function-wasm-rust
    functionRef:
      name: function-wasm
    input:
      apiVersion: guestfn.crossplane.io/v1
      kind: Input
      module:
        # For local rendering the runtime serves this directory (--module-dir),
        # under a manifest that asks for the fixture server instead of
        # api.cloudflare.com. In a cluster use type: OCI, the oci reference
        # pinned to the digest guestfn push prints, and no manifestPath: the
        # published artifact carries its own manifest.
        type: Path
        path: fn.wasm
        manifestPath: example/guestfn.local.yaml
      config:
        # The Origin's spec.config holds the module's configuration: for the
        # render, the ipsUrl of the fixture render.sh serves (example/xr.yaml);
        # left unset, the module reads https://api.cloudflare.com/client/v4/ips.
        from: spec.config
        allowEmpty: true
