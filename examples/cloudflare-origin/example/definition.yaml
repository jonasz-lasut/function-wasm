# An origin server behind Cloudflare: the security group in front of it, and
# who may reach it. Crossplane v2: a namespaced composite resource, no claim.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: origins.network.example.org
spec:
  group: network.example.org
  names:
    kind: Origin
    plural: origins
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [region, vpcId]
            properties:
              region:
                description: The AWS region of the origin's VPC.
                type: string
              vpcId:
                description: The VPC the origin's security group belongs to.
                type: string
              port:
                description: The port the origin serves on.
                type: integer
                minimum: 1
                maximum: 65535
                default: 443
              exposure:
                description: >-
                  Who may reach the origin: cloudflare admits Cloudflare's
                  published edge ranges, read at every reconcile; private
                  admits no one.
                type: string
                enum: [cloudflare, private]
                default: private
          status:
            type: object
            properties:
              cloudflare:
                description: The Cloudflare ranges the ingress rules admit.
                type: object
                properties:
                  etag:
                    description: The etag of the list the rules were built from.
                    type: string
                  ranges:
                    description: How many ranges the rules admit.
                    type: integer
