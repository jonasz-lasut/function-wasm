[package]
name = "cloudflare-origin"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "A function-wasm ABI v2 guest: lets only Cloudflare reach an origin, with security group rules built from Cloudflare's published IP ranges fetched over async wasi:http"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The component bindings (src/bindings.rs) exist only in the wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
pollster = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
