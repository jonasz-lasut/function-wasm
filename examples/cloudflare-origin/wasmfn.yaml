# The module manifest: what this module declares about itself. guestfn build
# validates it, guestfn push publishes it beside the module as the artifact's
# manifest layer, and the runtime holds it against what the policy layers grant
# before every run - a manifest can refuse a run earlier and say why, never
# make one possible.
abi: 2
name: cloudflare-origin
version: 0.1.0
# The one capability this module cannot run without: reading Cloudflare's
# published IP ranges. The runtime makes the request on the module's behalf,
# and only once the Composition's compositionPolicy and the operator's Cedar
# policy both permit it.
requires:
  egress:
    http:
    - host: api.cloudflare.com
      methods: [GET]
      pathPrefix: /client/v4/ips
config:
  # The JSON Schema (draft 2020-12) of the Input's config; the runtime refuses
  # a request whose config does not match, naming the field.
  schema:
    type: object
    properties:
      ipsUrl:
        description: Where to read Cloudflare's IP ranges; defaults to https://api.cloudflare.com/client/v4/ips.
        type: string
        format: uri
    additionalProperties: false
