# The documentation site (https://jonasz-lasut.github.io/guestfn/),
# built by mdBook from docs/ - the same directory the one-pagers and
# docs/abi-v2.md live in, so nothing the code or the conformance goldens
# name by path moves. docs/SUMMARY.md is the table of contents: mdBook
# renders only the pages listed there. .github/workflows/docs.yml builds
# it on every pull request that touches it and deploys main to GitHub Pages.
[book]
title = "guestfn"
description = "Crossplane composition functions that run a WebAssembly module in a Wasmtime sandbox (function-wasm) or an OCI image in a microVM (function-oci)"
authors = ["The guestfn Authors"]
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
site-url = "/guestfn/"
git-repository-url = "https://github.com/jonasz-lasut/guestfn"
edit-url-template = "https://github.com/jonasz-lasut/guestfn/edit/main/{path}"
# The accent alludes to WebAssembly's purple over the built-in themes
# (docs/theme/wasm.css overrides their CSS variables; no forked theme).
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["docs/theme/wasm.css"]
# mdBook's highlight.js has no Cedar grammar; docs/theme/cedar.js highlights
# the ```cedar blocks with Cedar's own (vendored beside it in docs/theme/).
additional-js = ["docs/theme/cedar.js"]

[output.html.search]
limit-results = 20

# The pages that moved when the book got a path per runtime (#252): their
# old URLs, linked from release notes and published READMEs, redirect.
[output.html.redirect]
"/guests/write-a-module.html" = "../wasm/write-a-module.html"
"/guests/other-languages.html" = "../wasm/other-languages.html"
"/guests/render-locally.html" = "../wasm/render-locally.html"
"/guests/oci-modules.html" = "../oci/modules.html"
"/operators/install.html" = "../wasm/install.html"
"/operators/sizing.html" = "../wasm/sizing.html"
"/operators/oci-runtime.html" = "../oci/install.html"
