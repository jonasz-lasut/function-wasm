[workspace]
resolver = "3"
members = ["crates/engine", "crates/function", "crates/guestfn"]
# The example guests are deliberately standalone: a guest depends on nothing
# in this repository.
exclude = ["examples/hello-rust", "examples/hello-rust-v2"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jonasz-lasut/function-wasm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
