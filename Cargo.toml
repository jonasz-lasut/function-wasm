[workspace]
resolver = "3"
members = ["crates/engine", "crates/function", "crates/guestfn", "crates/e2e"]
# The example guests are deliberately standalone: a guest depends on nothing
# in this repository. The end-to-end suite's test module is a guest too,
# built for wasm32-wasip3 on the rust scaffold's pinned toolchain.
exclude = ["examples/cloudflare-origin", "crates/e2e/guest"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jonasz-lasut/function-wasm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
