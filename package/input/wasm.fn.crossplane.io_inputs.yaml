---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: inputs.wasm.fn.crossplane.io
spec:
  group: wasm.fn.crossplane.io
  names:
    categories:
    - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Input configures which WebAssembly module function-wasm runs and what it
          receives.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          config:
            description: |-
              Config is passed to the module verbatim as part of its request input.
              The runtime does not interpret it; a Go guest reads it with
              wasmfn.GetConfig.
            type: object
            x-kubernetes-preserve-unknown-fields: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          module:
            description: Module locates the WebAssembly module to run.
            properties:
              http:
                description: HTTP downloads the module from a URL.
                properties:
                  digest:
                    description: |-
                      Digest is the sha256 of the module, sha256:<hex>; the download is
                      verified against it and it addresses the module in the caches.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  url:
                    description: URL of the module.
                    pattern: ^https?://
                    type: string
                required:
                - digest
                - url
                type: object
              httpFrom:
                description: |-
                  HTTPFrom names a field of the observed composite resource, under spec
                  or status, that holds an HTTP source — an object with url and digest.
                pattern: ^(spec|status)\..+
                type: string
              oci:
                description: OCI pulls the module from an OCI registry.
                properties:
                  credentials:
                    description: |-
                      Credentials names a credential of the pipeline step (a Secret) used to
                      pull the artifact. The Secret carries either a .dockerconfigjson key
                      or username and password keys. Without it the function's own Docker
                      config (DOCKER_CONFIG) and anonymous access are tried.
                    type: string
                  ref:
                    description: |-
                      Ref is the artifact reference pinned to its manifest digest,
                      registry/repository@sha256:<hex>, as guestfn push prints it. The
                      manifest digest pins the module: the manifest names its layer's
                      digest and every fetch is verified along that chain, so it also
                      addresses the module in the caches. A tag alone is not accepted: tags
                      can be moved, and the runtime resolves nothing at request time.
                      registry/repository:tag@sha256:<hex> is fine — the digest is what is
                      fetched, the tag is human-readable context.
                    pattern: ^[^@\s]+@sha256:[a-f0-9]{64}$
                    type: string
                required:
                - ref
                type: object
              ociFrom:
                description: |-
                  OCIFrom names a field of the observed composite resource, under spec
                  or status, that holds an OCI source — an object with ref — e.g.
                  "status.module". The value is read on every request, so each composite
                  resource can pick its own module. It may not name credentials: the
                  module is pulled with the runtime's Docker config or anonymously, since
                  the composite resource's author would otherwise choose the registry a
                  step credential is sent to.
                pattern: ^(spec|status)\..+
                type: string
              path:
                description: |-
                  Path names a module file relative to the directory the function was
                  started with (--module-dir); it is refused when that flag is unset.
                  Meant for local rendering and volume-mounted modules; it carries no
                  digest.
                type: string
              pathFrom:
                description: |-
                  PathFrom names a field of the observed composite resource, under spec
                  or status, that holds a module path (a string) relative to --module-dir.
                pattern: ^(spec|status)\..+
                type: string
            type: object
            x-kubernetes-validations:
            - message: exactly one of oci, http, path, ociFrom, httpFrom and pathFrom
                must be set
              rule: '[has(self.oci), has(self.http), has(self.path), has(self.ociFrom),
                has(self.httpFrom), has(self.pathFrom)].filter(x, x).size() == 1'
        required:
        - module
        type: object
    served: true
    storage: true
