apiVersion: meta.pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-oci
  annotations:
    meta.crossplane.io/maintainer: Jonasz Małecki <jonaszlasut@proton.me>
    meta.crossplane.io/source: github.com/jonasz-lasut/guestfn
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: "A composition function that runs an OCI image supplied through its input in a Firecracker microVM: the image is an ordinary Crossplane function that the runtime calls over gRPC, under the same manifest and policy layers as function-wasm's WebAssembly modules. Alpha: the pod needs /dev/kvm."
    meta.crossplane.io/readme: |
      function-oci runs an OCI image in a microVM, one VM per request. The
      image serves FunctionRunnerService, as any Crossplane function does,
      and the runtime calls it over gRPC; its
      source is an artifact that wraps the image, named in the step's Input
      or read from a field of the composite resource, and its config block
      is passed through untouched. One installed function serves any number
      of images. The pod needs /dev/kvm. See the
      [documentation](https://jonasz-lasut.github.io/guestfn/) for the
      OCI runtime's install page and the contract, and the
      [repository](https://github.com/jonasz-lasut/guestfn) for the source.
spec:
  capabilities:
  - composition
