# Vale (https://vale.sh) over the documentation site, the README and
# SECURITY.md. `make vale` installs the pinned binary under .cache/tools,
# syncs the packages below into .vale/styles (gitignored; the project's own
# vocabulary beside them is checked in) and runs it, and
# .github/workflows/docs.yml runs that target on every pull request that
# touches the docs. The style set is crossplane/docs's less alex (its
# profanity and ableism rules flagged "failed", "invalid" and the DWARF
# format: noise here) - Google, Microsoft, proselint and write-good, with
# the same overlaps switched off - plus ai-tells, the vocabulary and
# structure fingerprints of machine-written prose. Every package is pinned
# to a release by URL (a bare catalog name floats); Renovate moves the pins.
StylesPath = .vale/styles
MinAlertLevel = warning

# .vale/styles/config/vocabularies/FunctionWasm: the names and terms every
# style accepts as spelled - and, for an entry with a capital, the casing
# Vale.Terms then requires everywhere.
Vocab = FunctionWasm

Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/errata-ai/Microsoft/releases/download/v0.15.1/Microsoft.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Google, Microsoft, proselint, write-good, ai-tells

# The overlaps crossplane/docs switches off, for the same reasons: the
# Oxford comma is not enforced, and the rest duplicate a rule of another
# style.
Google.OxfordComma = NO
Google.Will = NO
Google.Latin = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Foreign = NO
Microsoft.Quotes = NO
Microsoft.GeneralURL = NO

# One em dash tripped three rules; ai-tells.EmDashUsage is the one kept (it
# also catches the en dash), and the house rule is a short dash or a colon.
Google.EmDash = NO
Microsoft.Dashes = NO

# Passive voice gates only the pages added after 2026-10-28. The pages
# judged sentence by sentence that day (40 analysts, one per page; the
# sentences worth it rewritten, the rest kept on purpose: admission and
# refusal vocabulary such as "is refused" and "is granted", normative
# rules such as "must be permitted by", decision history, and statives
# the rule cannot tell apart such as "is set" and "is unchanged") are
# listed below with the check off. A new page is written active or, once
# judged, joins the list; a page rewritten wholesale comes off it to be
# judged again. Google and Microsoft carry the same check at suggestion
# level; off there for the same reason.
[{SECURITY.md,docs/abi-v2.md,docs/contract/compatibility.md,docs/guests/module-manifests.md,docs/guests/other-languages.md,docs/guests/render-locally.md,docs/guests/validate.md,docs/guests/write-a-module.md,docs/how-a-request-runs.md,docs/one-pager-abi-v2.md,docs/one-pager-cache.md,docs/one-pager-module-manifest.md,docs/one-pager-module-source-schema.md,docs/one-pager-resource-governance.md,docs/one-pager-sandbox.md,docs/one-pager-three-layer-authz.md,docs/one-pager-trust-model.md,docs/one-pager-use-case-examples.md,docs/operators/cedar-policy.md,docs/operators/grant-policy.md,docs/operators/http-egress.md,docs/operators/input-reference.md,docs/operators/install.md,docs/operators/metrics.md,docs/operators/readiness.md,docs/operators/runtime-flags.md,docs/operators/signatures.md,docs/operators/sizing.md,docs/operators/troubleshooting.md,docs/operators/trust-model.md,docs/project/testing.md,docs/use-cases.md}]
write-good.Passive = NO
Google.Passive = NO
Microsoft.Passive = NO
